board:
  vendor:
    value: FutureProofHomes
    provenance: vendor_doc
    source: https://docs.futureproofhomes.net/satellite1-introduction/
  model:
    value: Satellite1 CORE rev4.1 (R2024.12.06), Public Batch #1
    provenance: vendor_doc
    source: https://github.com/FutureProofHomes/Satellite1-Hardware
    note: 'R2024.12.06 is the vendor''s literal revision-date tag, not marketing.
      The KiCad title block of core/rev4.1coreSCH.pdf reads Date 2024-12-06 /
      Rev rev4.1. Predecessor rev4/R2024.11.07 and successor rev4.2/R2025.01.31
      were prototypes; rev4.1 is the first public batch, shipped to customers by
      2025-01-31. This is the ORIGINAL generation, not Satellite1.1 -- the
      original has a built-in antenna, Sat1.1 requires an external IPEX one.'
  architecture:
    value: two-board stack -- CORE (compute) + HAT (audio/sensors)
    provenance: vendor_doc
    source: https://docs.futureproofhomes.net/satellite1-assembly/
    note: 'The CORE is the rectangular compute board in a Raspberry Pi Zero
      footprint: ESP32-S3-WROOM-1 N16R8, USB-C, boot/reset buttons, 40-pin
      header. The HAT is the round audio board: XMOS XU316, 4 PDM mics, 24
      WS2812 LEDs, TAS2780 25W amp, PCM5122, AHT20, LTR-303ALS, FUSB302 USB-PD,
      4 buttons. They mate over the RPi 40-pin header. The probed silicon is the
      CORE only -- every audio part above lives on the HAT.'
  wroom_module:
    value: ESP32-S3-WROOM-1 N16R8
    provenance: vendor_doc
    source: https://futureproofhomes.net/products/satellite1-core-board.json
    note: 'N16R8 = 16MB flash + 8MB PSRAM. The eFuse readout matches exactly,
      so vendor spec and silicon agree here -- unlike the LilyGo, where the
      vendor listing could not narrow the board at all.'
  firmware_running:
    value: Satellite1 v0.0.5-beta.1 (released 2024-12-19)
    provenance: vendor_doc
    source: https://github.com/FutureProofHomes/Satellite1-ESPHome/releases
    note: 'Identified by downloading the vendor''s archived factory image and
      comparing: that image''s partition table hashes to exactly this board''s
      partition_table_md5 (676548594bf6c3ad8a13ec77fc4ef196) and its app
      descriptor matches byte-for-byte -- version 2024.11.2, project satellite1,
      Dec 19 2024 15:24:15, IDF 4.4.8. About 13 releases behind v0.2.0.
      CAREFUL: "2024.11.2" in the app descriptor is the ESPHOME version, not the
      Satellite1 firmware version. Two numbering systems, easily conflated.'
  partition_table_origin:
    value: ESPHome stock auto-generated ESP-IDF layout for 16MB -- NOT custom
    provenance: vendor_doc
    source: https://github.com/FutureProofHomes/Satellite1-ESPHome/releases
    note: 'Every element that looks bespoke falls out of ESPHome''s own
      generator: app0/app1 at 7.75MB each because APP_PARTITION_SIZES["16MB"] =
      0x7C0000 halves the leftover flash into two OTA slots; nvs at 436KB
      (0x6D000) because that is ESPHome''s hardcoded IDF_NVS_SIZE at that
      version; nvs at the end with otadata at 0x9000 because gen_esp32part.py
      places partitions in listed order and otadata is listed first; and no
      filesystem partition because ESPHome''s ESP-IDF layout never creates one.
      RECORDED AS A CORRECTION: this table was first read as a vendor
      fingerprint, on the reasoning that it differed from stock arduino-esp32.
      It differs from THAT stock and matches a DIFFERENT one. "Not the stock
      layout I know" is not the same as "custom".'
  nvs_contents:
    value: ESPHome preferences, esp_wifi config, and a PHY RF calibration cache
    provenance: vendor_doc
    source: https://github.com/FutureProofHomes/Satellite1-ESPHome
    note: 'Checked because a 436KB nvs raised the question of whether something
      unrecoverable lives there. It does not. All four vendor C++ components
      were grepped for nvs/preferences/efuse/serial with zero hits; nvs holds
      only the "esphome" preferences namespace, esp_wifi''s own config, and a
      MAC-keyed PHY calibration cache ESP-IDF regenerates on demand. Device
      identity comes from the eFuse MAC (name_add_mac_suffix), not from flash.
      There is no nvs_keys partition, so NVS is unencrypted and can be dumped
      and restored with esptool. A full erase costs saved Wi-Fi credentials and
      entity states, nothing more.'
  xmos_coprocessor:
    value: XMOS XU316 with its OWN SPI flash, flashed by the ESP32
    provenance: vendor_doc
    source: https://github.com/FutureProofHomes/Satellite1-ESPHome/blob/main/esphome/components/satellite1/memory_flasher/xmos_flashing.cpp
    note: 'XMOSFlasher reads a JEDEC ID and does chip_erase/erase_sector/
      read_page/write_page over SPI (CS GPIO10, MODE3, 8MHz; reset GPIO4), so
      the XMOS firmware is on a SEPARATE chip that esptool cannot see -- a full
      esptool backup of this board does NOT contain it. Mitigated: the ESPHome
      config embeds the XMOS image in the ESP32 binary at build time
      (memory_flasher embed_flash_image), and it is auto-reflashed on boot. So
      restoring the ESP32 image restores the ability to reflash the XMOS, and in
      practice the XMOS follows. What is NOT captured is the XMOS chip''s
      current contents -- recovery means reflashing the embedded version, not
      restoring what was there.'
  read_baud_max:
    value: 230400
    provenance: verified
    note: 'Physical test via the backup ladder: 460800 failed with serial
      corruption after 4.7s, 230400 read the full 16MB in 750.5s. Fifth
      USB-Serial/JTAG board, fifth to land on this ceiling. Also the first CLEAN
      16MB measurement in the repo -- 750.5s against 728.2s predicted by the
      10-bits-per-byte model, 3.1% over. The LilyGo''s comparable figure was
      756.5s but whole-ladder; subtracting a discard of similar size puts the
      two boards within about a second of each other.'
  usb_pd_behaviour:
    value: amplifier mode depends on the negotiated USB-PD contract voltage
    provenance: vendor_doc
    source: https://github.com/FutureProofHomes/Satellite1-ESPHome/blob/main/config/satellite1.base.yaml
    note: 'The config activates the TAS2780 in mode 2 only when
      pd_fusb302b.contract_voltage >= 9, and a different mode otherwise. On a
      plain 5V USB-A port the amplifier runs reduced. Operationally this is the
      first thing to check if audio sounds underpowered -- it is a power
      negotiation outcome, not a config error.'
verification_log:
- date: '2026-09-05'
  tested: board.read_baud_max
  method: Full 16MB esptool read-flash via the backup baud ladder.
  result: verified
  note: 'Ninth board, fifth USB-Serial/JTAG, and the FIRST backup since the
    per-rung timer fix to actually fall back -- so it is the first manifest
    where read_seconds and ladder_seconds diverge: 750.5 vs 755.2, differing by
    exactly the 4.7s discarded 460800 attempt, with the rungs summing to the
    ladder total. It also turns "the ladder fails fast" from a claim in the S3
    devkit''s profile note ("reproducible in <6s") into a recorded measurement
    that every future fallback will collect automatically.'
