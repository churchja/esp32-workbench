board:
  read_baud_max:
    value: 460800
    provenance: verified
    note: 'Physical test: full 4MB backup completed in 33s at 460800 on the first ladder attempt. Notably
      HIGHER than the ESP32-S3''s 230400 ceiling, so this limit is per-board (USB peripheral + cable +
      host), not per chip family. This board speaks USB-OTG; the S3 speaks USB-Serial/JTAG.'
verification_log:
- date: '2026-09-04'
  tested: board.read_baud_max
  method: Full 4MB esptool read-flash via the backup baud ladder.
  result: verified
  note: 33s measured vs ~91s predicted by the 10-bits-per-byte framing model -- USB-OTG CDC does not appear
    to throttle to the nominal baud. The model stays a safe upper bound for timeouts.
