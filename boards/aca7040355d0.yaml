board:
  vendor:
    value: M5Stack
    provenance: inferred
    note: 'Operator called it "M5Stack Capsule v1.1". Corroborated by the MAC OUI
      ac:a7:04, which the Cardputer ADV (aca704007f60) also carries, and by the
      partition table matching M5Stack''s stock layout byte-for-byte. Still
      inferred, not vendor_doc: no vendor string reaches USB in download mode.'
  read_baud_max:
    value: 230400
    provenance: verified
    note: 'Physical test via the backup ladder: 460800 failed with serial
      corruption after 7.4s, 230400 read 8MB in 374.1s. Sixth USB-Serial/JTAG
      board, sixth to land on this ceiling. Measured 374.1s against 364.1s
      predicted by the 10-bits-per-byte model, 2.7% over -- and it is the first
      CLEAN 8MB timing in the repo. The M5 Stamp S3 (381.0s) and Cardputer ADV
      (385.4s) figures are whole-ladder and predate the per-rung timer, so they
      are upper bounds. This board''s own whole-ladder equivalent is 381.5s,
      within half a second of the Stamp S3 -- same vendor, same stock partition
      layout, effectively the same read.'
  fallback_cost:
    value: 7.4s
    provenance: verified
    note: 'THE DISCARDED 460800 ATTEMPT IS NOT A CONSTANT. The Satellite1
      measured 4.7s for the same failure two hours earlier; this board took
      7.4s, 57% longer. A prediction of "about 4.7s" was made before this read
      and was wrong -- generalising a constant from a single measurement, which
      is failure pattern 2 in the build log, committed immediately after
      documenting it. Recording the cost per attempt rather than assuming it is
      exactly what the per-rung timer exists for.
      It also contradicts an older claim: the S3 devkit''s profile has said
      since day one that the failures are "reproducible in <6s at both failing
      rates", from a hand-run experiment on that one board. 7.4s exceeds that.
      The bound was real for the board it was measured on and is not general.'
verification_log:
- date: '2026-09-05'
  tested: board.fallback_cost
  method: 'Recorded automatically by read_with_fallback, which times each baud
    rung separately and returns them. No separate experiment was run -- the
    figure falls out of the same backup that measured read_baud_max.'
  result: verified
  note: 'Second measured fallback in the repo. Satellite1 4.7s, this board 7.4s.
    Two points are not a distribution, but they are enough to retire "about 5
    seconds" as a usable constant and enough to contradict the S3 devkit''s
    "<6s" claim, which was hand-measured on one board and generalised.'
- date: '2026-09-05'
  tested: board.read_baud_max
  method: Full 8MB esptool read-flash via the backup baud ladder.
  result: verified
  note: 'Tenth board, sixth USB-Serial/JTAG. Second post-fix backup to fall back,
    so the second manifest where read_seconds and ladder_seconds diverge --
    374.1 vs 381.5, differing by exactly the 7.4s discard, rungs summing to the
    ladder total. Two fallbacks now measured at 4.7s and 7.4s, which is the
    result: the cost varies and must be measured, not assumed.'
