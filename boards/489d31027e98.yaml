recovery:
  backups:
    value: 2 independent full-flash reads, byte-identical outside nvs
    provenance: verified
    note: |
      backups/489d31027e98/ holds two 4,194,304-byte images read 48 minutes apart,
      plus the upstream release asset the app region hash-matches. tools/cmpflash.py
      across the two reads reports 11,122 differing bytes, ALL of them inside nvs
      (0x9000, 20KB). bootloader, partition-table, otadata, app0, app1 and spiffs are
      byte-identical across both reads.
      That is the part worth having: it is not "a backup exists", it is "the read
      path is reproducible on this board", which is the assumption a restore rests
      on. nvs differing is expected -- the firmware boots and writes RF calibration
      and Wi-Fi state there.
  restore_paths:
    value: 2
    provenance: probed
    note: |
      1. LOCAL, complete. Either full image restores all 4MB including bootloader,
         partition table and nvs. This is the only path that covers 0x0-0x10000.
      2. UPSTREAM, app region only.
         backups/489d31027e98/upstream-marauder-v1.12.3-dev_board_pro.bin, 1,555,168
         bytes, verified byte-identical to what is on the board. Covers 0x10000
         onward and nothing else.
      NO SECOND SOURCE exists for: bootloader 0x0-0x8000, partition table 0x8000,
      otadata 0xe000, nvs 0x9000. If the local backups are lost, those four regions
      are unrecoverable from the internet. They are small; that is exactly why they
      are easy to forget.
  vendor_reflash_path:
    value: unavailable in the current firmware state
    provenance: vendor_doc
    source: https://github.com/HoneyHoneyTeam/ESP32-Marauder-Double-Barrel-5G
    note: |
      THE FINDING THAT MATTERS FOR "can we reflash the Marauder code". The vendor's
      supported update route is NOT over USB. Verbatim from the README: download the
      V6 firmware, rename it to "update.bin", put it on the microSD card, then on the
      device go Device > Update firmware > SD Update > Yes. It also warns "Using the
      wrong or a corrupted firmware file may brick the device."
      That route requires a working screen and a working menu. The flashed
      DEV_BOARD_PRO target compiles out HAS_SCREEN, HAS_TOUCH and HAS_BUTTONS, so
      there is no menu to navigate and no way to press Yes.
      So it is circular: the SD updater is the way to fix the firmware, and it needs
      the firmware fixed first. USB is currently the ONLY way back in. That does not
      make the board unrecoverable -- USB works, esptool connects, both restore paths
      above are intact -- but it does mean the vendor's own instructions cannot be
      followed on this unit until a screen-capable build is on it.
  partition_scheme_matches:
    value: true
    provenance: probed
    note: |
      Marauder CI builds the v6 target with FQBN
      esp32:esp32:d32:PartitionScheme=min_spiffs. This board's table is app0/app1 at
      1,966,080 bytes each with a 192KB spiffs -- that IS min_spiffs. A v6 image
      would drop into the existing table with no repartition, and the v1.15.1 v6
      asset is 1,710,224 bytes, comfortably inside app0.
      Checked because a partition mismatch is the usual way this kind of flash goes
      wrong, and it is cheap to check and expensive to discover afterwards.
  ota_fallback:
    value: none
    provenance: probed
    note: 'app1 at 0x1f0000 is NOT a second bootable image -- its first byte is 0x21,
      not the 0xE9 an ESP32 image header requires. Checked because "there are two OTA
      slots" reads like a safety net and here it is not one. The 135,063 non-blank
      bytes in it are the overflow tail of the prior firmware, not firmware of their
      own. If app0 is destroyed there is no on-device fallback; recovery is the local
      backup over USB or nothing.'
  status:
    value: recoverable, not yet reflashed
    provenance: probed
    note: |
      Nothing has been written to this board. The owner asked to ENSURE the install
      is recoverable and that Marauder can be reflashed; both are now established as
      facts rather than assumptions. Flashing a screen-capable build is a separate
      decision and has not been authorised.
research_queue:
- field: display_present
  status: resolved
  resolution: 'Owner photographs identified the product; vendor documents a 2.8-inch
    touch screen. See display.panel_type. The prescribed next step below -- "look at
    the board, photograph both sides" -- is exactly what settled it, and it cost one
    step where flash forensics had spent an entire session bounding the answer
    without reaching it. Worth remembering the next time a board resists
    identification: the cheapest instrument is a camera.'
  why: 'The owner believes an OLED is attached; the firmware provably does not drive
    one. Those are different questions and only the second is answerable from flash.
    No value is recorded on purpose -- writing "false" would convert an absence of
    evidence into a recorded negative for the next session to build on.'
  how: 'Look at the board. A photograph of both sides settles display presence, the
    silkscreen vendor mark (ideaspark / DOIT / HW-394) and the bridge IC marking at
    once, with no power-state change and no writes. Only if a panel is visibly
    present but the board is unmarked is an I2C scan worth the trip.'
  danger: 'An I2C scan overwrites app0 and destroys the Marauder install. Two
    independent restore paths exist -- the local full-image backup, and the official
    release asset the image hash-matches -- so it is reversible, but it is a write.
    projects/i2c-variant-scan is currently an ESP32-S3/16MB project and needs
    set-target esp32 and a 4MB flash size before it will build for this chip.'
- field: candidate_board_family
  status: resolved
  resolution: 'HoneyHoney Lab ESP32 Marauder Double Barrel 5G. Note how the CH340
    reasoning below performed: it correctly ruled out Heltec / TTGO / Lolin32, and
    it correctly concluded "not an integrated-OLED family board". It then reached
    for "hand-wired or kit-built TFT on a plain devkit" as the leading hypothesis,
    which was wrong -- the real answer was a commercial multi-radio product that
    happens to use a CH340. The eliminations held; the positive guess did not. That
    asymmetry is the useful lesson, not the miss.'
  why: 'The CH340 is a strong discriminator and narrows the field usefully.
    Heltec WiFi Kit 32, TTGO LoRa32 and Wemos Lolin32 OLED -- the mainstream
    classic-ESP32 boards with an INTEGRATED OLED -- all ship CP2102, not CH340.
    That leaves hand-wired OLED on a plain devkit, or an ideaspark-class board
    which puts a soldered OLED on a DevKit V1 layout and does use CH340.
    UPDATE after the owner looked at the board: the panel is a TFT, not an OLED,
    and the owner does not believe it is ideaspark-class. Both of those cut
    against the integrated-OLED families entirely, which makes a hand-wired or
    kit-built TFT on a plain devkit the leading hypothesis.'
  how: 'Silkscreen, or an I2C scan on GPIO21/22 (the pins both candidates would use).'
  danger: 'GPIO21 is GPS_TX in the currently-flashed build AND the most likely SDA.
    GPIO16 is the NeoPixel data pin here AND the OLED RST on Heltec/TTGO layouts.
    Do not drive either on an assumption.'
- field: display
  status: unknown
  why: Display controller, resolution, and bus pins are a board-level design choice; nothing on the SoC
    records them.
  how: Vendor schematic for the ESP32-D0WD-V3 board carrying this display. Then check for an existing
    BSP component -- search the ESP Component Registry (components.espressif.com) for the board name,
    and espressif/esp-bsp, which already encodes panel type, offsets and pins for many vendor boards.
    Confirm the controller part (ST7789 / ILI9341 / SSD1680 / GDEH...) before writing an esp_lcd driver.
- field: pinmap
  status: unknown
  why: GPIO assignment is a PCB routing decision, invisible to probing.
  how: Vendor schematic PDF first. Then a BSP component for this board (esp-bsp or the ESP Component Registry)
    -- its bsp/*.h header is a machine-readable pin map and beats prose. Then IDF examples shipped by
    the vendor. Mark every pin 'unverified' until a physical test confirms it.
  danger: Driving a wrong pin can short a rail. Never mark verified without a hardware test.
- field: power
  status: unknown
  why: Battery connector, charge IC, and ADC divider ratio are board-level.
  how: Schematic. The divider ratio in particular is a magic number that cannot be guessed and silently
    corrupts every battery reading.
