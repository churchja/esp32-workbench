board:
  model:
    value: HoneyHoney Lab "ESP32 Marauder Double Barrel" (the plain variant, not the 5G)
    provenance: community
    source: https://github.com/HoneyHoneyTeam/ESP32-Marauder-Double-Barrel
    note: |
      VARIANT SETTLED BY THE OWNER, who read the device in hand and stated it twice.
      That is the authority here and it is above anything photographs support.
      HOW THE FIRST ANSWER WENT WRONG, kept because the failure mode is reusable.
      The product family came from owner photographs matched against vendor photos,
      and that part held. The VARIANT was then called as "5G / BW16" on the strength
      of the moulded label set -- "433M / A / GPS" across the top, "D" left, "B" over
      "C" right, "2.4G" with a dot-and-digit at each bottom corner. Fetching the
      PLAIN variant's README afterwards showed that label set does not discriminate
      at all. Both products ship 433MHz CC1101, GPS, four antennas and two 2.4GHz
      radios; "Double Barrel" means two Wi-Fi radios in BOTH, the 5G merely swapping
      the second ESP32 for a BW16. The evidence was checked for consistency with the
      candidate and never for consistency with the alternative, which is the actual
      error and is not specific to radios.
      Both variants are also identical on every fact this profile acts on: Marauder
      hardware version V6 (each README says so verbatim), a 2.8-inch touch screen,
      the same A/B/C/D lettering, dual USB-C. So nothing downstream moved when the
      variant changed -- worth knowing before spending effort on a distinction.
      A PROPOSED TEST THAT WAS WRONG, recorded so it is not proposed again: "plug
      into the other USB-C port, an ESP32-S2 will enumerate on the plain variant and
      a Realtek BW16 will not". The owner tried it -- nothing enumerates. The second
      chip is Flipper-side over the GPIO comb and is not on USB at all; per the
      README the second USB-C is for charging. A test whose negative result means
      "the hardware does not work that way" is not a test.
      ONE FURTHER CORRECTION, recorded rather than quietly overwritten:
        A stated inference that "two 2.4GHz antenna positions imply a second
        2.4GHz radio, almost certainly nRF24-class" was WRONG. There is no nRF24.
        The two 2.4G positions are two separate Wi-Fi radios. On THIS variant the
        second is an ESP32-S2, Flipper-controlled; on the 5G it is a BW16.
      Also worth keeping: "generic devkit, model not identified" was as far as flash
      bytes could reach, and it was the right call at the time -- then a photograph
      falsified it in one step. Flash forensics bounded the board; the case
      identified it.
      Vendor is HoneyHoney Lab / HoneyHoneyTrading (Australia); also sold on Tindie:
      https://www.tindie.com/products/honeyhoneytrading/esp32-marauder-double-barrel-5g-c5-version/
  unit_role:
    value: second Marauder (Flipper-side), NOT the unit with the screen
    provenance: probed
    source: https://github.com/HoneyHoneyTeam/ESP32-Marauder-Double-Barrel
    note: |
      SETTLED BY MAC. The sibling unit's own Device Info screen reports Station MAC
      48:9D:31:02:A9:48. This chip's eFuse MAC, re-read directly to be certain, is
      48:9D:31:02:7E:98. Both are genuine Espressif OUI 48:9D:31 assignments, not
      randomised locally-administered addresses, so they are two physical chips and
      not one chip reporting a soft MAC.
      "Double Barrel" is literal: two Marauder units in one enclosure. Every
      observation in this file belongs to the second one.
      Per the vendor README the second unit "utilise UART 15 and 16 for communicating
      with Flipper" and is flashed over USB-C via ESPWebTool while holding its own
      boot button, using files from the "Flipper Zero Wifi Dev Board" section --
      specifically a firmware whose name includes _rev_feather.bin.
      ONE THING DOES NOT RECONCILE, recorded open rather than smoothed over: that
      README calls the second unit an ESP32-S2. This chip is a classic ESP32-D0WD-V3
      behind a CH340, which an S2 cannot be -- an S2 has native USB and would
      enumerate as usbmodem, not usbserial. Either this batch differs from the
      documentation or the documentation is stale. Do not resolve this by assuming.
  hardware_target:
    value: Flipper-side unit; NOT MARAUDER_V6
    provenance: vendor_doc
    source: https://github.com/HoneyHoneyTeam/ESP32-Marauder-Double-Barrel
    note: |
      RETRACTED AND REPLACED. This field previously read MARAUDER_V6, on the vendor
      line "The hardware version of this marauder is V6". That line is true and it is
      about the OTHER unit -- whose own screen reports "Hardware: Marauder v6.1".
      The vendor's documented firmware for THIS unit is different: ESPWebTool at
      esp.huhn.me, with bootloader, partitions, boot app and a firmware .bin whose
      name includes _rev_feather.bin, taken from the "Flipper Zero Wifi Dev Board"
      section. MARAUDER_DEV_BOARD_PRO -- what is actually flashed -- is in that
      family. It is a Flipper Zero dev-board target for a headless unit, which is
      what this is. So the firmware here is plausibly correct and was never shown to
      be wrong.
      WHAT THIS RETRACTION PREVENTED. The recommendation on file was to flash
      esp32_marauder_..._v6.bin to "fix the dark screen". That would have put a
      screen, touch, SD and GPS build onto a unit with none of those, replacing
      firmware that appears to be doing its job. The pre-flight, the backup and the
      MAC-keyed gate were all working; what was wrong was the target of the
      reasoning, and no amount of verification catches that.
      The GPIO21 pin collision cited here (v6 TOUCH_CS vs dev_board_pro GPS_TX) is
      real in the source and simply does not apply: the v6 build was never meant for
      this chip.
  prior_firmware:
    value: a larger image, ~2,102,112 bytes, identity unrecoverable
    provenance: inferred
    note: 'The verification_log entry of 2026-09-07 has the measurement. Short form:
      546,944 bytes of firmware-shaped data survive past the end of the running
      image, spanning 0x1bb9e0 to 0x21135f, which implies a prior image at
      0x010000..0x211360 under a larger-app partition table than the one now on the
      board. Its identifying strings sat in the overwritten first 1.55MB, so what
      survives is code and cannot be named. Recorded because "the wrong build was
      flashed over a working one" is otherwise only the owner''s account, and this is
      independent physical corroboration of it.'
  radios:
    value:
    - ESP32 Wi-Fi 2.4GHz + BT (the SoC profiled in `identity`)
    - ESP32-S2 -- second Wi-Fi radio, Flipper-controlled, NOT on this SoC
    - CC1101 sub-GHz 433MHz
    - GPS receiver
    provenance: vendor_doc
    source: https://github.com/HoneyHoneyTeam/ESP32-Marauder-Double-Barrel
    note: |
      Only the first entry is this profile's SoC. The rest share the enclosure and
      are NOT reachable from the ESP32 -- they are Flipper-side, driven over the GPIO
      comb, and none of them appears on USB. The owner confirmed this empirically:
      the second USB-C port enumerates nothing.
      Recorded here so that a future session does not read "four antennas" off the
      case and conclude this ESP32 has four radios. It has one.
  firmware_running:
    value: ESP32 Marauder v1.12.3, build target MARAUDER_DEV_BOARD_PRO
    provenance: probed
    source: https://github.com/justcallmekoko/ESP32Marauder/releases/download/v1.12.3/esp32_marauder_v1_12_3_20260622_marauder_dev_board_pro.bin
    note: 'Identified by EXACT SHA-256, not by a version string. The app image read
      off this board -- flash 0x010000, 1,555,168 bytes, ESP32 image header walked
      through 6 segments to find the true end -- hashes to
      0eded72c4396930f06814362375ef368192b79ebf3a4d8b8ffe2b05c1e9d6843, which is
      byte-identical to the official release asset of the same size. Both halves
      checked independently.
      Worth contrasting with the LilyGo entry in README: esp_app_desc_t here says
      only project "arduino-lib-builder", IDF v5.5.1-710, built 2025-11-12 -- the
      same generic Arduino core stamp that collides across unrelated vendors. It
      identifies neither the board nor the application. The flash hash does both.'
display:
  present:
    value: false
    provenance: probed
    note: |
      CORRECTED 2026-09-07, and this is the largest correction in this file.
      This profile is the SECOND ESP32 of a two-ESP32 device. It has no panel.
      The 2.8-inch touch screen belongs to the OTHER unit -- see sibling_board.
      What this replaces: present=true, provenance=inferred, sourced to owner visual
      inspection, with panel_type "2.8-inch touch TFT" at vendor_doc and controller
      ILI9341 at community. All of it described a real panel on a real board. None of
      it described THIS board.
      How the error worked, because it is worth more than the fact: the owner said
      there was a screen (true, of the device), the vendor documented a 2.8-inch
      touch screen (true, of the device), and this chip reported no display (true, of
      the chip). Three correct statements were fused into one wrong one by an
      unexamined assumption that the device contained a single ESP32. "Double Barrel"
      names that assumption and contradicts it, and it was in the product title the
      whole time.
      The earlier finding that no display-controller string appears anywhere in this
      board's 4MB was accurate and is now explained rather than explained away: the
      firmware compiles TFT_eSPI out AND there is nothing for it to drive.
  driven_by_firmware:
    value: false
    provenance: probed
    note: |
      Unchanged and still true: MARAUDER_DEV_BOARD_PRO has "//#define HAS_SCREEN"
      commented out, and Display.h guards the whole display layer behind it. What
      changed is the meaning. This was recorded as a FAULT to be fixed by flashing a
      screen-capable build. It is not a fault. A Flipper-side unit with no panel
      should have no display layer, and this one does not.
pinmap: {}
peripherals:
  serial_cli:
    value: present and responding at 115200
    provenance: verified
    note: 'Sent "help" over /dev/cu.usbserial-110 after letting the boot settle; got
      the Marauder banner and the full command list back -- channel, settings,
      clearlist, reboot, update -s/-w, ls, led, gpsdata, gps, nmea, gpspoi,
      gpstracker, evilportal, karma.
      Recorded first as "the only interface this board has, with screen and touch
      compiled out", which framed it as a workaround for a broken unit. It is not a
      workaround. A headless Flipper-side unit is driven over UART and serial IS its
      interface. The observation was right and the framing was wrong.
      Method note that outlived the mistake: the first probe sent "help" 0.5s after
      opening the port and got back replayed boot text, which reads exactly like a
      dead CLI. The board was still booting. Waiting 8s changed the answer. A probe
      of a device that is still starting up does not return "no", it returns noise.'
  sd_card:
    value: none on this unit
    provenance: probed
    note: 'Boot log says "Failed to mount SD Card" / "SD Card NOT Supported", and that
      is CORRECT BEHAVIOUR, not a symptom. The microSD belongs to the sibling unit,
      which reports it Connected at 29820MB on its own Device Info screen.
      Previously recorded as "present in hardware, not mountable under the flashed
      firmware" and blamed on a pin-map mismatch. Wrong unit.'
  gps:
    value: not wired to this unit
    provenance: probed
    note: 'Boot log says "Could not detect GPS baudrate" / "GPS Not Found". Same
      correction as the SD card: previously read as a pin conflict between v6 TOUCH_CS
      on GPIO21 and dev_board_pro GPS_TX on GPIO21. That conflict is real in the
      source and irrelevant here, because the v6 build was never meant for this chip.
      Whether the GPS module is reachable from this unit at all is genuinely open --
      the enclosure has one GPS antenna and a switch (C) that toggles its power
      source, so which ESP32 it feeds is a wiring question this profile cannot
      answer. See research_queue.'
  _retracted_symptom_set:
    value: withdrawn
    provenance: probed
    note: 'A previous entry grouped dark screen + unmountable SD + undetected GPS as
      "three faults with one cause: a build whose pin map does not match this
      hardware", and argued that reading them together was the insight. The grouping
      was right and the cause was wrong. All three are the expected reports of a
      headless Flipper-side unit that has none of those peripherals attached.
      Kept rather than deleted because the reasoning pattern -- several independent
      faults sharing one cause -- is sound and will be reached for again. It failed
      here for a reason that had nothing to do with the pattern: the wrong subject.'

recovery:
  backups:
    value: 2 independent full-flash reads, byte-identical outside nvs
    provenance: verified
    note: |
      backups/489d31027e98/ holds two 4,194,304-byte images read 48 minutes apart,
      plus the upstream release asset the app region hash-matches. tools/cmpflash.py
      across the two reads reports 11,122 differing bytes, ALL of them inside nvs
      (0x9000, 20KB). bootloader, partition-table, otadata, app0, app1 and spiffs are
      byte-identical across both reads.
      That is the part worth having: it is not "a backup exists", it is "the read
      path is reproducible on this board", which is the assumption a restore rests
      on. nvs differing is expected -- the firmware boots and writes RF calibration
      and Wi-Fi state there.
  restore_paths:
    value: 2
    provenance: probed
    note: |
      1. LOCAL, complete. Either full image restores all 4MB including bootloader,
         partition table and nvs. This is the only path that covers 0x0-0x10000.
      2. UPSTREAM, app region only.
         backups/489d31027e98/upstream-marauder-v1.12.3-dev_board_pro.bin, 1,555,168
         bytes, verified byte-identical to what is on the board. Covers 0x10000
         onward and nothing else.
      NO SECOND SOURCE exists for: bootloader 0x0-0x8000, partition table 0x8000,
      otadata 0xe000, nvs 0x9000. If the local backups are lost, those four regions
      are unrecoverable from the internet. They are small; that is exactly why they
      are easy to forget.
  vendor_reflash_path:
    value: not applicable to this unit
    provenance: vendor_doc
    source: https://github.com/HoneyHoneyTeam/ESP32-Marauder-Double-Barrel
    note: |
      RETRACTED. This described the microSD update route -- rename the V6 bin to
      update.bin, then Device > Update firmware > SD Update > Yes -- and concluded it
      was blocked here because the flashed target has no screen, no touch and no
      buttons, making the menu unreachable. Every step of that is accurate about a
      route that belongs to the OTHER unit, which has the screen, the menu and the
      SD card and can follow it today.
      The vendor's route for THIS unit is different and was in the same README:
      ESPWebTool at esp.huhn.me over USB-C, holding this unit's own boot button, with
      four files -- bootloader, partitions, boot app, and a firmware .bin whose name
      contains _rev_feather.bin -- from the "Flipper Zero Wifi Dev Board" section.
      USB was never a fallback here. It is the documented path.
  partition_scheme_matches:
    value: true
    provenance: probed
    note: |
      Marauder CI builds the v6 target with FQBN
      esp32:esp32:d32:PartitionScheme=min_spiffs. This board's table is app0/app1 at
      1,966,080 bytes each with a 192KB spiffs -- that IS min_spiffs. A v6 image
      would drop into the existing table with no repartition, and the v1.15.1 v6
      asset is 1,710,224 bytes, comfortably inside app0.
      Checked because a partition mismatch is the usual way this kind of flash goes
      wrong, and it is cheap to check and expensive to discover afterwards.
  ota_fallback:
    value: none
    provenance: probed
    note: 'app1 at 0x1f0000 is NOT a second bootable image -- its first byte is 0x21,
      not the 0xE9 an ESP32 image header requires. Checked because "there are two OTA
      slots" reads like a safety net and here it is not one. The 135,063 non-blank
      bytes in it are the overflow tail of the prior firmware, not firmware of their
      own. If app0 is destroyed there is no on-device fallback; recovery is the local
      backup over USB or nothing.'
  serial_update_command:
    value: exists but is blocked
    provenance: probed
    note: 'The CLI exposes "update -s" (SD) and "update -w" (web), which is the same
      updater the vendor documents behind the touchscreen menu -- so the missing menu
      is NOT actually the blocker it looked like. The blocker is one layer down: the
      SD card does not mount under this build, so "update -s" has nothing to read
      from. "update -w" would be a network fetch and a write, and has not been run.
      This supersedes the earlier reading that the vendor SD path was unreachable
      purely for want of a screen. It is unreachable for want of a mounted card.
      USB remains the clean path in either case.'
  status:
    value: recoverable, and no longer believed to need reflashing
    provenance: probed
    note: |
      Nothing has been written to this board. The recoverability work stands
      unchanged and was verified on the silicon: two full backups, a region-by-region
      read-back match, and a second source for the app region.
      What changed is the conclusion it was serving. There is no longer a known
      defect to repair. This unit boots, runs Marauder v1.12.3 on a Flipper-family
      target, answers its serial CLI, and reports absent peripherals it was never
      wired to. If it is misbehaving in its actual role -- talking to the Flipper
      over UART 15/16 -- that has not been tested and is the open question. Its
      screen, SD and GPS are not evidence of anything.
sibling_board:
  mac:
    value: 48:9D:31:02:A9:48
    provenance: probed
    note: |
      The OTHER ESP32 in the same enclosure -- the one with the screen. Read off its
      own Device Info page, photographed by the owner. Its AP MAC is 48:9D:31:02:A9:49,
      the usual base+1, which is a consistency check that this is a real base MAC.
      NOT PROFILED AND NOT BACKED UP. That is the point of recording it. This repo's
      rule is that no board gets written to without a verified backup of THAT board,
      keyed by eFuse MAC, and this board has neither a profile nor a backup. A whole
      session's worth of care went into protecting 48:9D:31:02:7E:98 while its twin
      sat in the same case, powered, unprotected, and unnoticed.
  self_reported:
    value: Marauder v1.12.1, Hardware "Marauder v6.1"
    provenance: probed
    note: |
      From its Device Info screen, verbatim: Firmware Marauder / Version v1.12.1 /
      Hardware Marauder v6.1 / ESP-IDF v5.5.1-710-g8410210c9a / WSL Bypass enabled /
      SD Card Connected / SD Card Size 29820MB / Battery Monitor supported /
      Battery Lvl 75%.
      Note it reports v6.1, not v6, while the vendor README says to download the V6
      version. The Marauder release ships both _v6.bin and _v6_1.bin at identical
      size. Do not act on that difference without checking which the device wants.
      Also note the ESP-IDF string is IDENTICAL to this profile's board -- both
      v5.5.1-710-g8410210c9a. That is the Arduino core stamp, not an identity, and
      here are two different chips carrying the same one. It is the same collision
      already recorded against firmware_running, seen from a second angle.
  status:
    value: healthy, nothing to fix
    provenance: probed
    note: |
      Screen renders, touch navigates, SD mounts at 29820MB, battery monitor reads
      75%. Everything the earlier diagnosis was trying to repair already works, on
      the unit that actually has the hardware.
research_queue:
- field: sibling_board.backup
  status: open
  why: 'The screen unit, MAC 48:9D:31:02:A9:48, is a second ESP32 in the same case
    with no profile and no backup. The backup gate is keyed by eFuse MAC, so the
    protection built for 48:9D:31:02:7E:98 does not extend to it by being nearby.
    It is also the unit that actually carries the user-visible firmware, the SD card
    and the battery -- the one with something to lose.'
  how: 'Identify and back it up like any other board: connect over ITS USB path, run
    tools/esp32ident.py, then esp32flash.py backup. Establishing which physical port
    or button sequence reaches it is the first unknown; the vendor README describes a
    boot button per unit.'
  danger: 'None for identify and backup -- both are read-only. The real risk is the
    status quo: an unbacked board sitting next to a carefully backed-up one creates a
    false sense that the device is protected.'
- field: flipper_uart_role
  status: open
  why: 'This unit exists to talk to a Flipper Zero over UART 15/16 per the vendor
    README, which also notes it requires GPIO configuration changes from the default
    pins. Whether the flashed build is correctly configured for that role is the only
    question left about it, and none of the work so far touched it.'
  how: 'The Marauder serial CLI is live and can list settings read-only. Beyond that
    it needs a Flipper in hand to test the link end to end.'
  danger: 'The CLI "settings" command takes a -r flag whose meaning was not
    established. Do not run flags on it speculatively; bare listing only.'
- field: gps_ownership
  status: open
  why: 'The enclosure has one GPS antenna and switch C toggles which battery powers
    it, but which of the two ESP32s the receiver actually feeds is unrecorded. This
    unit reports GPS Not Found; that may be correct wiring or a misconfiguration.'
  how: 'Sibling unit''s own GPS menu, or the vendor schematic if one exists.'
  danger: none, observation only
- field: display_present
  status: resolved
  resolution: 'Owner photographs identified the product; vendor documents a 2.8-inch
    touch screen. See display.panel_type. The prescribed next step below -- "look at
    the board, photograph both sides" -- is exactly what settled it, and it cost one
    step where flash forensics had spent an entire session bounding the answer
    without reaching it. Worth remembering the next time a board resists
    identification: the cheapest instrument is a camera.'
  why: 'The owner believes an OLED is attached; the firmware provably does not drive
    one. Those are different questions and only the second is answerable from flash.
    No value is recorded on purpose -- writing "false" would convert an absence of
    evidence into a recorded negative for the next session to build on.'
  how: 'Look at the board. A photograph of both sides settles display presence, the
    silkscreen vendor mark (ideaspark / DOIT / HW-394) and the bridge IC marking at
    once, with no power-state change and no writes. Only if a panel is visibly
    present but the board is unmarked is an I2C scan worth the trip.'
  danger: 'An I2C scan overwrites app0 and destroys the Marauder install. Two
    independent restore paths exist -- the local full-image backup, and the official
    release asset the image hash-matches -- so it is reversible, but it is a write.
    projects/i2c-variant-scan is currently an ESP32-S3/16MB project and needs
    set-target esp32 and a 4MB flash size before it will build for this chip.'
- field: candidate_board_family
  status: resolved
  resolution: 'HoneyHoney Lab ESP32 Marauder Double Barrel 5G. Note how the CH340
    reasoning below performed: it correctly ruled out Heltec / TTGO / Lolin32, and
    it correctly concluded "not an integrated-OLED family board". It then reached
    for "hand-wired or kit-built TFT on a plain devkit" as the leading hypothesis,
    which was wrong -- the real answer was a commercial multi-radio product that
    happens to use a CH340. The eliminations held; the positive guess did not. That
    asymmetry is the useful lesson, not the miss.'
  why: 'The CH340 is a strong discriminator and narrows the field usefully.
    Heltec WiFi Kit 32, TTGO LoRa32 and Wemos Lolin32 OLED -- the mainstream
    classic-ESP32 boards with an INTEGRATED OLED -- all ship CP2102, not CH340.
    That leaves hand-wired OLED on a plain devkit, or an ideaspark-class board
    which puts a soldered OLED on a DevKit V1 layout and does use CH340.
    UPDATE after the owner looked at the board: the panel is a TFT, not an OLED,
    and the owner does not believe it is ideaspark-class. Both of those cut
    against the integrated-OLED families entirely, which makes a hand-wired or
    kit-built TFT on a plain devkit the leading hypothesis.'
  how: 'Silkscreen, or an I2C scan on GPIO21/22 (the pins both candidates would use).'
  danger: 'GPIO21 is GPS_TX in the currently-flashed build AND the most likely SDA.
    GPIO16 is the NeoPixel data pin here AND the OLED RST on Heltec/TTGO layouts.
    Do not drive either on an assumption.'
- field: display
  status: unknown
  why: Display controller, resolution, and bus pins are a board-level design choice; nothing on the SoC
    records them.
  how: Vendor schematic for the ESP32-D0WD-V3 board carrying this display. Then check for an existing
    BSP component -- search the ESP Component Registry (components.espressif.com) for the board name,
    and espressif/esp-bsp, which already encodes panel type, offsets and pins for many vendor boards.
    Confirm the controller part (ST7789 / ILI9341 / SSD1680 / GDEH...) before writing an esp_lcd driver.
- field: pinmap
  status: unknown
  why: GPIO assignment is a PCB routing decision, invisible to probing.
  how: Vendor schematic PDF first. Then a BSP component for this board (esp-bsp or the ESP Component Registry)
    -- its bsp/*.h header is a machine-readable pin map and beats prose. Then IDF examples shipped by
    the vendor. Mark every pin 'unverified' until a physical test confirms it.
  danger: Driving a wrong pin can short a rail. Never mark verified without a hardware test.
- field: power
  status: unknown
  why: Battery connector, charge IC, and ADC divider ratio are board-level.
  how: Schematic. The divider ratio in particular is a magic number that cannot be guessed and silently
    corrupts every battery reading.
