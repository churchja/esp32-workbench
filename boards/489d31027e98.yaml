board:
  model:
    value: generic ESP32-WROOM-class devkit (DOIT DevKit V1 compatible)
    provenance: inferred
    note: 'NOT identified, only bounded. CH340 bridge + 4MB + ESP32-D0WD-V3 is
      consistent with a clone DevKit V1 and nothing in 4MB of flash names a board.
      Deliberately NOT taken from the firmware: the running image self-reports
      HARDWARE_NAME "Flipper Zero Dev Board Pro", which records what somebody chose
      to flash, not what the silicon is -- and is contradicted by the CH340, since
      the genuine Dev Board Pro does not use one. Owner reports "esp32 devkit v1
      with an oled screen (most likely)", hedged, and the hedge is respected here.'
  firmware_running:
    value: ESP32 Marauder v1.12.3, build target MARAUDER_DEV_BOARD_PRO
    provenance: probed
    source: https://github.com/justcallmekoko/ESP32Marauder/releases/download/v1.12.3/esp32_marauder_v1_12_3_20260622_marauder_dev_board_pro.bin
    note: 'Identified by EXACT SHA-256, not by a version string. The app image read
      off this board -- flash 0x010000, 1,555,168 bytes, ESP32 image header walked
      through 6 segments to find the true end -- hashes to
      0eded72c4396930f06814362375ef368192b79ebf3a4d8b8ffe2b05c1e9d6843, which is
      byte-identical to the official release asset of the same size. Both halves
      checked independently.
      Worth contrasting with the LilyGo entry in README: esp_app_desc_t here says
      only project "arduino-lib-builder", IDF v5.5.1-710, built 2025-11-12 -- the
      same generic Arduino core stamp that collides across unrelated vendors. It
      identifies neither the board nor the application. The flash hash does both.'
display:
  driven_by_firmware:
    value: false
    provenance: probed
    note: 'Every link in this chain is a checkable artifact, which is why it is
      probed rather than inferred: bytes read off this board -> exact SHA-256 match
      to release asset marauder_dev_board_pro -> in that tagged source,
      configs.h under #ifdef MARAUDER_DEV_BOARD_PRO has "//#define HAS_SCREEN"
      COMMENTED OUT, and Display.h guards the entire display layer plus the
      project''s only #include <TFT_eSPI.h> behind #ifdef HAS_SCREEN. The display
      layer compiles to nothing. Marauder also has no SSD1306/SH1106/U8g2 support
      to compile in even if the flag were set.
      A RED HERRING, recorded so it is not rediscovered: the image contains
      "display=SPI TFT". That is a fixed member initializer in WiFiScan.h emitted
      by EVERY Marauder build on every target as part of a Wigle wardriving CSV
      header. It says nothing about this board.
      This field says the FIRMWARE drives no panel. It does NOT say no panel is
      attached -- flash bytes cannot see solder. See research_queue.'
  present:
    value: true
    provenance: inferred
    note: 'OWNER VISUAL INSPECTION, not a measurement -- there is no provenance
      level for "a human looked at it", and this deliberately sits below anything
      that would authorise driving a pin.
      Calibration on that channel, recorded without judgement because it is useful:
      the owner first reported an OLED and then corrected it to a TFT after
      looking. Both reports came from the same source; the second is the one that
      survived contact with the board.
      Independently consistent with the firmware evidence: the Marauder build
      flashed here (MARAUDER_DEV_BOARD_PRO) compiles its display layer out
      entirely, so a panel being physically present and dark is the EXPECTED
      behaviour, not a fault.'
  panel_type:
    value: TFT (no-name, controller unknown)
    provenance: inferred
    note: 'Owner-reported, corrected from an earlier "OLED". Controller, resolution,
      bus and pins all remain unknown -- see research_queue. Marauder has no I2C
      OLED support at all, so a TFT is also the only panel type any Marauder build
      could ever drive on this board.'
  controller:
    value: null
    provenance: unverified
    note: 'Nothing in 4MB of flash names a display controller. No SSD1306, SH1106,
      ST7789, ILI9341, U8g2, Adafruit_GFX or TFT_eSPI string anywhere -- and the
      method was control-tested on this image (arduino-lib-builder, wifi, spiffs
      all found), so this is a real negative and not a broken search.'
