verification_log:
- date: '2026-09-07'
  tested: [peripherals.serial_cli, peripherals.sd_card, peripherals.gps]
  method: 'Opened /dev/cu.usbserial-110 at 115200 with pyserial, released DTR and RTS
    so the chip ran the app rather than entering download mode, pulsed RTS to force a
    clean reset, and captured the boot log. Then reopened, waited out the full boot,
    flushed the input buffer, sent "help" and read the reply. Read-only throughout --
    a reset is not a write, and no flash operation was performed.'
  result: verified
  note: 'Boot log carried "Failed to mount SD Card", "SD Card NOT Supported", "Could
    not detect GPS baudrate" and "GPS Not Found", then the Marauder banner reporting
    v1.12.3. "help" returned the full command list, so the serial CLI is a live
    control path -- the only one this board currently has, with screen, touch and
    buttons all compiled out.
    A METHOD NOTE WORTH MORE THAN THE RESULT: the first attempt sent "help" 0.5s
    after opening the port and got back only replayed boot text. That reads exactly
    like a dead CLI, and stopping there would have recorded a false negative. The
    board was still booting. Waiting 8s before sending changed the answer completely.
    Probes of a device that is still starting up do not return "no", they return
    noise, and the two are easy to confuse.
    The SD and GPS results are marked probed rather than verified deliberately: what
    is verified is that the FIRMWARE cannot see them. Whether the parts are physically
    present and healthy is a different claim, and the boot log cannot reach it.'
- date: '2026-09-07'
  tested: [recovery.backups, recovery.status]
  method: 'Read-only pre-flight. Split backup full-20260907T035323Z-4194304.bin into
    its seven partition regions locally, then ran a single esptool 5.2.0
    "verify-flash" at 230400 baud with --flash-mode/freq/size all "keep" (so esptool
    could not rewrite an image header before comparing) and --after no-reset, giving
    six address/file pairs in one connection: 0x0 bootloader, 0x8000 partition-table,
    0xe000 otadata, 0x10000 app0, 0x1f0000 app1, 0x3d0000 spiffs. nvs was excluded on
    purpose -- it is known to drift and would have masked the result.'
  result: verified
  note: 'All six regions reported "Verification successful (digest matched)"; exit 0.
    This is the check the earlier entry could NOT make. That one compared two reads
    of the board against each other, which proves the read path is reproducible but
    says nothing about whether the STORED backup still matches the silicon. This one
    reads the board and compares it to the file on disk, which is the claim a restore
    actually depends on.
    Worth naming as a gap in our own tooling: esp32flash.py''s "verify" subcommand
    does not do this. It re-hashes stored files against the manifest and never opens
    the port -- it detects local bit-rot, not divergence. Confirmed by reading
    cmd_verify, which takes an `esp` argument and ignores it. The board-reading check
    has to be esptool verify-flash, by hand, for now.
    The board was deliberately left in the bootloader (--after no-reset) rather than
    rebooted, so the firmware did not run and did not touch nvs. A power-cycle
    returns it to normal.'
- date: '2026-09-07'
  tested: [board.prior_firmware]
  method: 'Walked the ESP32 image header of app0 through its 6 segments to find the
    true image end (1,555,168 bytes, sha256 0eded72c...843, byte-identical to the
    official marauder_dev_board_pro release asset), then characterised every byte
    after it. Compared entropy and printable-run density against the running image''s
    own last 550KB as a control.'
  result: inferred
  note: 'NOT a clean result, and recorded as inferred rather than probed for that
    reason. 546,944 non-blank bytes sit past the end of the running image, running
    contiguously from 0x1bb9e0 through the end of app0 and on into app1 as far as
    0x21135f. Entropy 7.08 bits/byte against the running image''s 6.98; 419 printable
    runs of 8+ chars against the control''s 387. It is structurally firmware, not
    padding and not compressed junk.
    Implied prior image: 0x010000..0x211360, about 2,102,112 bytes. That does not fit
    this board''s 1.875MB app0, so whatever was there ran under a DIFFERENT partition
    table with a larger app partition -- and the current flash rewrote the table as
    well as the app.
    It carries none of Marauder, JustCallMeKoko, TFT_eSPI, ILI9341, HoneyHoney, BW16,
    CC1101 or NMEA, and no esp_app_desc_t magic. That is NOT evidence it was not
    Marauder: an ESP32 image puts rodata early and code late, so the identifying
    strings lived in the first 1.55MB -- exactly the part that was overwritten. What
    survives is the code tail, which is unidentifiable by construction.
    Consistent with the account that a working, larger firmware was replaced by the
    wrong build. It is corroboration, not proof, and it cannot be turned into proof
    from these bytes.'
- date: '2026-09-06'
  tested: [recovery.backups]
  method: 'Two full-flash reads of all 4,194,304 bytes taken 48 minutes apart
    (20260907T030511Z and 20260907T035323Z), each at 230400 baud after the ladder
    discarded 460800, then compared region by region with tools/cmpflash.py against
    this board''s own partition table.'
  result: verified
  note: 'Whole-image differing bytes 11,122; sum of per-region counts 11,122 (the two
    agree, so no differing byte fell outside a named region). All 11,122 are in nvs.
    bootloader, partition-table, otadata, app0, app1 and spiffs: 0 differing bytes
    each. This verifies read reproducibility, which is what a restore depends on. It
    does NOT verify that a write-back succeeds -- that claim would need an erase
    first, and nothing has been erased.'
