board:
  model:
    value: HoneyHoney Lab "ESP32 Marauder Double Barrel 5G" (BW16 / RTL8720DN variant)
    provenance: community
    source: https://github.com/HoneyHoneyTeam/ESP32-Marauder-Double-Barrel-5G
    note: |
      IDENTIFIED FROM OWNER PHOTOGRAPHS, matched marking-for-marking against the
      vendor's own product photos. The enclosure carries a label set that is not
      generic: "433M / A / GPS" moulded across the top edge, "D" on the left, "B"
      over "C" on the right, and "2.4G" with a dot-and-digit at each bottom corner
      (2 left, 1 right). The vendor photo carries the identical set in the identical
      places, plus a moulded "HoneyHoney Lab 5G" wordmark in the centre -- and a red
      LED bleeding through the case exactly at that wordmark, which is where the
      owner reported seeing a red glow. Same mould.
      TWO CORRECTIONS TO EARLIER ENTRIES IN THIS FILE, recorded rather than quietly
      overwritten:
        * "generic devkit, model not identified" was as far as flash bytes could
          reach, and it was the right call at the time -- but it was falsified by a
          photograph in one step. Flash forensics bounded the board; the case
          identified it.
        * A stated inference that "two 2.4GHz antenna positions imply a second
          2.4GHz radio, almost certainly nRF24-class" was WRONG. There is no nRF24.
          The two 2.4G positions are two separate Wi-Fi radios: the ESP32's own, and
          the BW16/RTL8720DN's. The reasoning was sound and the conclusion was not.
      The "Double Barrel" name refers to that pair of Wi-Fi radios. A sibling product
      substitutes an ESP32-C5 for the BW16; the owner's unit is the BW16 variant.
      Vendor is HoneyHoney Lab / HoneyHoneyTrading (Australia); also sold on Tindie:
      https://www.tindie.com/products/honeyhoneytrading/esp32-marauder-double-barrel-5g-c5-version/
  hardware_target:
    value: MARAUDER_V6
    provenance: vendor_doc
    source: https://github.com/HoneyHoneyTeam/ESP32-Marauder-Double-Barrel-5G
    note: |
      The vendor README states, verbatim: "The hardware version of this marauder is
      V6", and "If you would like to update the firmware, please remember to
      download V6 version".
      This is the whole diagnosis of the dark screen. The board is running
      MARAUDER_DEV_BOARD_PRO. In configs.h that target has "//#define HAS_SCREEN"
      commented out; MARAUDER_V6 sits under
      "#if defined(MARAUDER_V6) || defined(MARAUDER_V6_1)" and defines HAS_SCREEN,
      HAS_FULL_SCREEN, HAS_TOUCH, HAS_SD, HAS_GPS, HAS_BATTERY + HAS_IP5306 and
      HAS_NEOPIXEL_LED -- which is a line-by-line description of this product
      (2.8-inch touch screen, microSD, GPS, onboard battery).
      Corroborating detail: in the v6 User_Setup, GPIO21 is TOUCH_CS. In the
      DEV_BOARD_PRO build actually flashed, GPIO21 is GPS_TX. The two builds contend
      for the same pin, which is what a wrong-target flash looks like from the
      inside.
  prior_firmware:
    value: a larger image, ~2,102,112 bytes, identity unrecoverable
    provenance: inferred
    note: 'The verification_log entry of 2026-09-07 has the measurement. Short form:
      546,944 bytes of firmware-shaped data survive past the end of the running
      image, spanning 0x1bb9e0 to 0x21135f, which implies a prior image at
      0x010000..0x211360 under a larger-app partition table than the one now on the
      board. Its identifying strings sat in the overwritten first 1.55MB, so what
      survives is code and cannot be named. Recorded because "the wrong build was
      flashed over a working one" is otherwise only the owner''s account, and this is
      independent physical corroboration of it.'
  radios:
    value:
    - ESP32 Wi-Fi 2.4GHz + BT (the SoC profiled in `identity`)
    - BW16 / RTL8720DN -- 5GHz + 2.4GHz Wi-Fi, second radio, NOT on this SoC
    - CC1101 sub-GHz 433MHz
    - GPS receiver
    provenance: vendor_doc
    source: https://github.com/HoneyHoneyTeam/ESP32-Marauder-Double-Barrel-5G
    note: |
      Only the first entry is this profile's SoC. The rest share the enclosure and
      are NOT reachable from the ESP32 -- the vendor README puts the BW16 on "UART
      15 and 16 for communicating with Flipper", i.e. the Flipper Zero drives it,
      not the ESP32. The CC1101 is likewise a Flipper-side peripheral over port B.
      Recorded here so that a future session does not read "four antennas" off the
      case and conclude this ESP32 has four radios. It has one.
  firmware_running:
    value: ESP32 Marauder v1.12.3, build target MARAUDER_DEV_BOARD_PRO
    provenance: probed
    source: https://github.com/justcallmekoko/ESP32Marauder/releases/download/v1.12.3/esp32_marauder_v1_12_3_20260622_marauder_dev_board_pro.bin
    note: 'Identified by EXACT SHA-256, not by a version string. The app image read
      off this board -- flash 0x010000, 1,555,168 bytes, ESP32 image header walked
      through 6 segments to find the true end -- hashes to
      0eded72c4396930f06814362375ef368192b79ebf3a4d8b8ffe2b05c1e9d6843, which is
      byte-identical to the official release asset of the same size. Both halves
      checked independently.
      Worth contrasting with the LilyGo entry in README: esp_app_desc_t here says
      only project "arduino-lib-builder", IDF v5.5.1-710, built 2025-11-12 -- the
      same generic Arduino core stamp that collides across unrelated vendors. It
      identifies neither the board nor the application. The flash hash does both.'
