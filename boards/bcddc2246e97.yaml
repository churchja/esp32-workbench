board:
  read_baud_max:
    value: 230400
    provenance: verified
    note: 'Physical test via the backup ladder: 460800 failed with serial corruption, 230400 completed
      4MB in 202s. Same ceiling as the ESP32-S3 but for a different reason -- this is a CH340 UART bridge,
      where the nominal baud is a real line rate. 202s measured vs 182s predicted by the 10-bits-per-byte
      model (11% over), unlike USB-OTG which ran far faster than the model.'
verification_log:
- date: '2026-09-04'
  tested: board.read_baud_max
  method: Full 4MB esptool read-flash via the backup baud ladder.
  result: verified
  note: 'Third board, third data point: S2 (USB-OTG) 460800, S3 (USB-Serial/JTAG) 230400, this (CH340
    bridge) 230400. Two native boards disagree, so the ceiling is per-board, not per-interface.'
