research_queue:
- field: coprocessor_backup
  status: open
  why: 'The ESP32-C6 co-processor has its own firmware and is not covered by this
    board''s backup. It is not on USB-C, so the bench has not read it.'
  how: 'Guide read 2026-10-16. Recovery is covered without a backup: M5Burner
    publishes "Tab5 ESP32-C6 Wi-Fi SDIO" (v1.4.1 in the guide). A byte-exact backup
    is also possible: remove the back cover, connect a 3.3V USB-TTL adapter (GND,
    G0, EN, TXD, RXD, 3.3V) to the C6 download interface beside the module, then
    run esptool read_flash through that adapter. The guide uses M5Stack''s ESP32
    Downloader; any adapter with those six lines should do.'
  danger: 'Reading is safe once connected. The risk is physical: the cover comes
    off and a probe sits on live pads, so a slip across 3.3V and GND can damage
    the board. Check the pin order against the guide photo before powering it.'
- field: display
  status: unknown
  why: Display controller, resolution, and bus pins are a board-level design choice; nothing on the SoC
    records them.
  how: Vendor schematic for the ESP32-P4 board carrying this display. Then check for an existing BSP component
    -- search the ESP Component Registry (components.espressif.com) for the board name, and espressif/esp-bsp,
    which already encodes panel type, offsets and pins for many vendor boards. Confirm the controller
    part (ST7789 / ILI9341 / SSD1680 / GDEH...) before writing an esp_lcd driver.
- field: pinmap
  status: unknown
  why: GPIO assignment is a PCB routing decision, invisible to probing.
  how: Vendor schematic PDF first. Then a BSP component for this board (esp-bsp or the ESP Component Registry)
    -- its bsp/*.h header is a machine-readable pin map and beats prose. Then IDF examples shipped by
    the vendor. Mark every pin 'unverified' until a physical test confirms it.
  danger: Driving a wrong pin can short a rail. Never mark verified without a hardware test.
- field: power
  status: unknown
  why: Battery connector, charge IC, and ADC divider ratio are board-level.
  how: Schematic. The divider ratio in particular is a magic number that cannot be guessed and silently
    corrupts every battery reading.
