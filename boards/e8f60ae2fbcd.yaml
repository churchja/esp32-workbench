board:
  model:
    value: M5Stack Tab5
    provenance: vendor_doc
    source: https://docs.m5stack.com/en/core/Tab5
    note: |
      Confirmed by the owner, who has the device in hand, on 2026-10-16. That closes
      the gap the first entry named: the vendor page describes the product, and the
      owner ties this unit to it. Two facts read off the chip agree with both: the
      factory app calls itself project "m5stack_tab5", and the chip and 16MB flash
      match the spec page. Raised from inferred; there is no provenance level for
      an owner reading the label, so vendor_doc is the closest honest rung.
  coprocessor:
    value: ESP32-C6-MINI-1U, connected to the P4 over SDIO2
    provenance: vendor_doc
    source: https://docs.m5stack.com/en/core/Tab5
    note: |
      THIS DEVICE CONTAINS TWO MCUs AND ONLY ONE IS BACKED UP. The C6 handles
      Wi-Fi 6 and Thread/Zigbee for the P4. It is wired to P4 pins G8-G15 over
      SDIO and is not on the USB port, so it did not enumerate, has no profile of
      its own and is not covered by backups/e8f60ae2fbcd/. The backup step is keyed
      by eFuse MAC and cannot see it. This is the same shape as the Double Barrel
      (see boards/489d31027e98.yaml sibling_board), recorded here up front.
      Unlike the Double Barrel's screen unit, this chip IS reachable, just not
      through USB-C. M5Stack's restore guide (https://docs.m5stack.com/en/guide/tab5/c6_wifi_restore, read
      2026-10-16) says the PCB has "a reserved download interface for the ESP32-C6
      module", used through a USB-TTL adapter, ideally M5Stack's ESP32 Downloader.
      The guide's connection photo shows the Tab5 with its back cover removed and
      the downloader pressed onto a 6-pin interface beside the C6 module, pins
      labelled GND, G0, EN, TXD, RXD, 3.3V. The pin mapping is in that photo only:
      https://m5stack-doc.oss-cn-shenzhen.aliyuncs.com/1132/C145_Restore_Factory_WiFi_Firmware_02.jpg
      Vendor image: M5Burner, TAB5 section, "Tab5 ESP32-C6 Wi-Fi SDIO", official,
      v1.4.1 published 2025-06-06 in the guide's screenshot (may be newer now).
      The guide does not say whether the P4's firmware has to change; the
      procedure goes straight to the C6's own pins, so it appears not to.
  firmware_running:
    value: m5stack_tab5 639d9cc, IDF v5.4.2, built Mar 25 2026 (factory)
    provenance: probed
    note: |
      Single 10MB "factory" app partition and no OTA slots, so any flash replaces
      it outright. M5Stack publishes the factory image, its source, and a restore
      tutorial on the spec page; the local backup taken 2026-10-16 is the
      byte-exact copy of what this unit actually shipped with.
