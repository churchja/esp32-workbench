board:
  read_baud_max:
    value: 230400
    provenance: verified
    note: 'Physical test via the backup ladder: 460800 failed with serial corruption,
      230400 read the full 16MB. Fourth independent USB-Serial/JTAG board and the
      fourth to land on exactly this ceiling (e072a1fb9c5c, 3cdc75edd7b0,
      aca704007f60), across four different vendors, MACs and memory configs --
      the per-interface model now has four confirmations and no counterexample.
      First 16MB read the ladder has attempted, so it also doubles the largest
      image size the derived timeout has been exercised against: the derived
      ceiling was 2244s (size/(baud/10)*3+60) against a 756.5s actual, ~3x margin
      as designed.'
    caveat: 'The recorded read_seconds (756.5) is the whole-ladder wall time -- it
      includes the failed 460800 attempt, which is not separated out. The 230400
      read alone is therefore somewhat under 756.5s. Against the 10-bits-per-byte
      model (16777216*10/230400 = 728.1s predicted) the ladder-inclusive figure is
      3.9% over, so the read alone is closer to the model than any prior
      USB-Serial/JTAG measurement -- but this is a bound, not a measurement.'
verification_log:
- date: '2026-09-05'
  tested: board.read_baud_max
  method: Full 16MB esptool read-flash via the backup baud ladder.
  result: verified
  note: Seventh board, fourth USB-Serial/JTAG. Confirms 230400 for the interface
    group a fourth time. Also the first 16MB read in the repo, so the size-derived
    timeout was exercised at double the previous maximum without coming close to
    the ceiling.
