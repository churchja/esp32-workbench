board:
  read_baud_max:
    value: 230400
    provenance: verified
    note: 'Physical test via the backup ladder: 460800 failed with serial corruption, 230400 read the
      full 16MB. Fourth independent USB-Serial/JTAG board and the fourth to land on exactly this ceiling
      (e072a1fb9c5c, 3cdc75edd7b0, aca704007f60), across four different vendors, MACs and memory configs
      -- the per-interface model now has four confirmations and no counterexample. First 16MB read the
      ladder has attempted, so it also doubles the largest image size the derived timeout has been exercised
      against: the derived ceiling was 2244s (size/(baud/10)*3+60) against a 756.5s actual, ~3x margin
      as designed.'
    confirmed_by_second_read: The board was read again after the timer fix and the two runs settle this
      directly. Run 1 recorded read_seconds 756.5 with no attempts list; run 2 recorded read_seconds 747.3
      and ladder_seconds 756.8, with a 9.5s discarded 460800 attempt. The old field and the new ladder_seconds
      agree within 0.3s on the same board doing the same operation -- so the old read_seconds was indeed
      whole-ladder time, and the estimate of "somewhat under 756.5s" below is now measured at 747.3s (2.6%
      over the 728.1s model, not the 3.9% the inflated figure implied).
    caveat: 'The recorded read_seconds (756.5) is whole-ladder wall time -- it includes the failed 460800
      attempt, which this backup had no way to separate out. The 230400 read alone is therefore somewhat
      under 756.5s. Against the 10-bits-per-byte model (16777216*10/230400 = 728.1s predicted) the ladder-inclusive
      figure is 3.9% over, so the read alone is closer to the model than any prior USB-Serial/JTAG measurement
      -- but this is a bound, not a measurement. This board was the last to be recorded that way: read_with_fallback
      now times each rung separately and manifests carry read_seconds (successful rung), ladder_seconds
      (wall total) and a per-rung attempts list. This entry predates that and was deliberately not retro-fitted
      -- the split cannot be recovered after the fact.'
  vendor:
    value: LilyGO
    provenance: vendor_doc
    source: https://raw.githubusercontent.com/Xinyuan-LilyGO/LilyGo-AMOLED-Series/master/README.MD
  model_variant:
    value: T-Display-S3 AMOLED Plus 1.91in (RM67162, single SPI)
    provenance: verified
    note: 'Resolved 2026-09-04 by I2C scan on hardware, not by reading. Three devices answered on SDA=3/SCL=2:
      0x15 CST816 touch (so a 1.91in TOUCH board), 0x51 PCF85063 RTC (so the PLUS, not the Touch), and
      0x6b BQ25896 PMU (the BOARD_AMOLED_191_SPI signature). SDA=1/SCL=2 was silent, ruling out the 1.47in
      Lite''s AXP2101. The SDA=6/SCL=7 pair was never driven -- the scan exits at the first hit, as LilyGO''s
      own autodetect does. NOT determinable over USB: every board in this family is ESP32-S3R8 with 16MB
      flash and 8MB OPI PSRAM, which is why this needed a flash and a scan.'
    scanner: projects/i2c-variant-scan
  variant_bus:
    value: single SPI, 40MHz (NOT QSPI)
    provenance: vendor_doc
    source: https://raw.githubusercontent.com/Xinyuan-LilyGO/LilyGo-AMOLED-Series/master/src/LilyGo_AMOLED.h
    note: RM67162_AMOLED_SPI sets d2 = d3 = -1. The QSPI pin set that two vendor repos agreed on -- SCK
      47, D0 18, D1 7, D2 48, D3 5, CS 6, RST 17 at 75MHz -- is real and belongs to a DIFFERENT board.
      It does not apply here.
  variant_candidates:
    value:
    - T-Display-AMOLED-Lite 1.47in 194x368 SH8501
    - T-Display-S3 AMOLED 1.91in 240x536 RM67162 (QSPI)
    - T-Display-S3 AMOLED Plus 1.91in 240x536 RM67162 (single SPI)
    - T4-S3 2.41in 450x600 RM690B0
    - T-Display-S3-AMOLED-1.64 280x456
    - T-Display-S3-AMOLED-1.43/1.75 466x466 round, CO5300 or SH8601
    provenance: vendor_doc
    source: https://raw.githubusercontent.com/Xinyuan-LilyGO/LilyGo-AMOLED-Series/master/README.MD
    note: The first four come from the vendor support table, which lists all four as ESP32-S3R8/16MB/8MB(OPI).
      The last two live in separate repos; the 1.43/1.75 ships board files for 4MB, 8MB and 16MB flash,
      so flash size does not exclude it either.
  probe_discriminates_variant:
    value: false
    provenance: probed
    note: 'Every identifying field this repo collects turned out to be generic. partition_table_md5 b32dcdb83b1674af27768c92b1f88a62
      is byte-for-byte espressif/arduino-esp32 tools/partitions/default_16MB.csv -- a stock Arduino layout,
      not a LilyGO board file. USB 303a:1001 is the generic Espressif native USB-Serial/JTAG ID. The "arduino-lib-builder
      / v4.4.7" app description is the standard arduino-esp32 core build stamp. Useful to know: these
      three fields identify a BUILD, never a board.'
  variant_evidence_weak:
    value: WRONG -- it pointed at the non-touch board; the scan says Plus
    provenance: community
    source: https://raw.githubusercontent.com/Xinyuan-LilyGO/T-Display-S3-AMOLED/main/boards/lilygo-t-amoled.json
    note: KEPT AS A RECORD OF A FAILED INFERENCE, not as evidence. That board file declares flash_size
      16MB, flash_mode qio, memory_type qio_opi, hwids [0x303A,0x1001] and partitions default_16MB.csv
      -- all four match this probe, and the factory app era matched too. Every one of those checks passed
      and the conclusion was still wrong, because the file matches a SIBLING. The corroboration pass predicted
      exactly this ("the same board file would match several siblings"), which is why it was recorded
      as circumstantial and never written into a pinmap. Four matching fields is not identification when
      the fields are shared across a product line.
  firmware_running:
    value: LilyGO published factory image (firmware/firmware.bin, 2026-01-07)
    provenance: verified
    note: 'Identified by app_elf_sha256 b697e0d2ce802e5245a9dd5d2bb3bd387d1a5038
      9f5156a8befd37f23928ca5c, which is the ONLY descriptor field that can tell
      this image from the one it replaced -- project, version string and build
      timestamp are byte-identical between them.
      Chosen over the as-shipped firmware (elf 61d714e4...) because it carries a
      PCF85063 driver the original lacks: symbol-string comparison shows 2
      references in the published image and 0 in the original. This board has
      that RTC at 0x51, so the firmware it shipped with could not talk to it.
      History on this unit: shipped 61d714e4 -> published image b697e0d2 ->
      i2c-variant-scan -> restore to 61d714e4 -> RM67162 driver attempts ->
      restore to 61d714e4 -> published image b697e0d2 (current). Both stored
      backups hold the AS-SHIPPED firmware, so a restore rolls back to that and
      loses the RTC driver; reflashing the published image takes seconds and its
      sha256 is a8939c043a738a139d0fad9849bbdab80331b3e1059832bfc0ccce9aaa364782.'
  upstream_report:
    value: crosser/esp-lcd-panel-rm67162#5
    provenance: community
    source: https://github.com/crosser/esp-lcd-panel-rm67162/issues/5
    note: 'The DC-pin finding and both Kconfig-gated additions were reported to
      the driver''s author on 2026-09-05. Filed as an issue rather than a pull
      request because the component metadata points repository_info.url at the
      author''s own cgit (www.average.org/cgit), so GitHub may be a mirror and a
      PR could presume a workflow they do not use. Issue #2 on that repo is a
      previously accepted adaptation to a different controller, so variant work
      does get engaged with there.
      The report states what was NOT tested: no QSPI board was available here,
      so it is unproven that the change does not regress the boards the driver
      was written for. Issue #1 there is a user reporting success on a Waveshare
      1.91in module -- the exact configuration at risk.'
  bsp_component:
    value: none exists
    provenance: vendor_doc
    source: https://components.espressif.com/
    note: 'Searched the ESP Component Registry and espressif/esp-bsp: no board support package exists
      for ANY variant in this family. The "check for a BSP first" shortcut that the research_queue recommends
      is closed for this board -- a panel driver must be written or a third-party one adopted.'
verification_log:
- date: '2026-09-06'
  tested: [pinmap.touch_sda, pinmap.touch_scl, pinmap.touch_int,
           peripherals.touch_controller]
  method: 'Ran projects/lilygo-vaultweather''s ''t'' console command, which brings up
    an IDF 6.0 i2c_master bus on SDA=3/SCL=2 at 100kHz, scans 0x08..0x77, reads the
    CST816 identity registers (0xA7 chip, 0xA8 vendor, 0xA9 firmware), then polls
    registers 0x01..0x06 at 20Hz for 10s while the screen was tapped by hand. GPIO21
    sampled as an input in the same loop.'
  result: verified
  note: 'Scan returned 0x15, 0x51, 0x6B -- reproducing the 2026-09-04 variant scan
    exactly. NEW, and beyond what that scan could establish: the part identifies as
    chip id 0xB5 = CST816S, vendor 0x22, firmware 0x03, so the REGISTER interface
    works and not merely address decoding. 34 touch events were read with plausible
    coordinates (x 220..243, y 87..116 for repeated taps in one spot). The documented
    risk did not materialise -- CST816 parts sleep aggressively and usually need RST
    pulsed, no touch-reset pin is known for this board, and it answered anyway;
    GPIO17 (lcd_rst) is the likely shared line but that is NOT tested. COORDINATE
    FRAME IS NOT RESOLVED: x brushing 240 while y stays low suggests the controller
    reports in the panel''s native 240x536 portrait frame, which is rotated 90
    degrees from the 536x240 the app draws in. A tap-to-wake feature does not care;
    anything that maps a touch to a UI element will have to establish the transform
    by tapping known corners.'
- date: '2026-09-05'
  tested:
    - pinmap.button_1
  method: >-
    Scan of 20 safe GPIOs as pull-up inputs at 50ms, after fixing a render bug
    that had been wedging the app. GPIO0 goes low on every press, is the only
    pin that moves, and reproduced across 8 consecutive sample windows.
  result: verified
  note: >-
    The original value was correct. Two rounds of "no button found" were the
    instrument failing, not the board: the animation used transform_scale on 14
    objects, which stalled LVGL's render loop, so the scanner had stopped
    running before any press was made. A null result from an unverified
    instrument is not evidence -- confirm the tool is alive in the same window
    the measurement is taken, not merely at startup.
- date: '2026-09-05'
  tested:
    - pinmap.button_1
  method: >-
    Retraction. GPIO21 was recorded as verified on one low reading at 7.49s,
    coincident with the scanner's first pass; it never reproduced.
  result: unverified
  note: >-
    One unreproduced observation is not a verification. Recording it as one was
    the error this provenance ladder exists to prevent.
- date: '2026-09-05'
  tested:
    - pinmap.button_1
  method: >-
    projects/lilygo-pipboy scans 20 safe GPIOs as inputs with internal pull-ups
    at 50ms and logs any that go low. Display pins (47,18,6,17,7,38,9), octal
    PSRAM (33-37), UART0 (43,44), strapping (45,46) and USB (19,20) excluded.
    GPIO5 and GPIO48 WERE included: they are lcd_d3/lcd_d2 in the QSPI pinout,
    but the Plus leaves them unwired, so they are free pins on this board.
  result: verified
  note: >-
    GPIO21 goes low on press; GPIO0 does not move. A first pass scanning only
    GPIO0 produced nothing, which was ambiguous between "wrong pin" and "500ms
    poll too slow" -- scanning every candidate at 50ms answered both at once.
    Confirms the profile was right to hold button_1 at unverified.
- date: '2026-09-05'
  tested:
    - pinmap.lcd_te
  method: >-
    GPIO9 configured as input with a rising-edge ISR; edges counted over a 2s
    window while the panel was actively driven by LVGL.
  result: verified
  note: >-
    197 edges/second, repeatably. The PIN is confirmed driven by the panel: an
    unconnected input with no pull does not produce 197 clean rising edges a
    second. The RATE is NOT explained and is deliberately not recorded as a
    frame rate -- 197Hz is not 60Hz, and the candidates (per-line rather than
    per-frame TE, double-counted transitions, or ISR latency artefacts) have
    not been distinguished. Open item, see research_queue.
- date: '2026-09-05'
  tested: display.orientation
  method: 'Read the LVGL scroll text that runs after the solid fills -- the first
    asymmetric content put on the panel.'
  result: verified
  note: 'Text upright and left-to-right, so swap_xy(true) + mirror(true, false)
    is correct for this board. This needed a SEPARATE observation from the fills:
    a uniform colour cannot distinguish any rotation from any other, so the
    experiment that verified colour format and addressing could not have settled
    this one however carefully it was run.'
- date: '2026-09-05'
  tested: [display.color_format, display.addressing_covers_panel]
  method: 'The same solid-fill run. Colours were reported correct and in order,
    and each covered the whole panel.'
  result: verified
  note: 'Scope kept narrow on purpose. This proves the pixel format and that the
    addressed area matches the panel. It does NOT prove orientation: a uniform
    colour is rotation-invariant, so swap_xy and mirror are untested and
    display.orientation stays unverified.'
- date: '2026-09-05'
  tested: [pinmap.lcd_pwr, pinmap.lcd_rst, pinmap.lcd_sck, pinmap.lcd_d0_mosi,
           pinmap.lcd_cs, pinmap.lcd_dc]
  method: 'Drove the panel from ESP-IDF until it lit. Built the LilyGO SPI init
    sequence and a DC-toggling transport into a vendored copy of
    crosser/esp-lcd-panel-rm67162, then painted the full screen white, red,
    green and blue directly via esp_lcd_panel_draw_bitmap -- deliberately before
    lv_init(), so no LVGL behaviour could explain either outcome.'
  result: verified
  note: 'THE PANEL LIT. That verifies the whole display chain on this unit at
    once: PWR 38 active-high, RST 17, SCK 47, MOSI 18, CS 6, DC 7, 40MHz,
    SPI mode 0, and LilyGO''s rm67162_spi_cmd init sequence.
    D2 48 / D3 5 stay unverified: they are recorded as NOT wired to the panel,
    which is a different claim and one the working display does not test.
    TE 9 and button 0 likewise untested.
    SIX CONFIGURATION PERMUTATIONS FAILED BEFORE THIS. Bus width, init sequence,
    GPIO0 conflict, graphics stack bypass, power polarity, and D2/D3 -- all in
    layers ABOVE a transport that could never have worked. esp_lcd_panel_io_spi
    accepts both framings through one API (lcd_cmd_bits 32 with no DC, or 8 with
    a DC pin); both compile, both return ESP_OK, and nothing on this bus reads
    back, so the wrong one is silent rather than wrong.'
- date: '2026-09-05'
  tested: firmware_running
  method: 'Flashed LilyGO''s published factory image at 0x0 through the backup
    gate, then re-probed and compared app_elf_sha256. Boot confirmed separately
    by reading the 20KB nvs partition and diffing it against the pre-flash
    backup rather than by watching a console.'
  result: verified
  note: 'THE VERSION STRINGS CANNOT VERIFY THIS FLASH. The published image and
    the image it replaced carry byte-identical descriptors -- project
    arduino-lib-builder, version "esp-idf: v4.4.7 38eeba213a", built Mar 5 2024
    12:12:53. All of it unchanged before and after. The only field that moved is
    app_elf_sha256: 61d714e4... -> b697e0d2..., matching the downloaded image
    exactly. esp_app_desc_t carries exactly one field that identifies a build,
    and it is not any of the human-readable ones.
    WHAT THE FLASH GAINED, established by comparing symbol strings in the two
    binaries rather than inferred from a file date: the published image carries
    2 references to PCF85063 and the resident app carried NONE. This board has a
    PCF85063 RTC at 0x51 -- one of the three devices whose presence identified it
    as the Plus -- and the firmware it shipped with could not talk to it. CST816
    went 4 -> 6 references. The display path is unchanged and the panel looks
    identical, which is the expected result: initSequence.cpp/.h has had zero
    commits since 2024-12-18.
    CORRECTS A RESEARCH CLAIM. The source sweep concluded BOARD_AMOLED_191_SPI
    first appears in library v1.1.0 (2024-10-14), so firmware stamped March 2024
    "predates its own board support". The resident binary contains
    beginAMOLED_191_SPI, so it did not. The stamp is the arduino-lib-builder
    CORE build time, not the sketch''s, so it cannot date the firmware at all --
    the resident app was built some unknown time after October 2024 while
    reporting Mar 5 2024 12:12:53.
    Pre-flash diff established the risk was low: bootloader IDENTICAL (0 of
    32768 bytes differ) and partition table IDENTICAL (0 of 4096), so only app0
    changed. The apps themselves differ in 1,769,209 of 2,501,392 bytes (70.7%),
    and the resident app was 8,784 bytes longer -- walking the six ESP image
    segments showed everything past its end was cleanly 0xff, so the earlier
    "contains data" reading was a naive scan against the wrong boundary.
    BOOT EVIDENCE: 688 of 20,480 nvs bytes changed against the pre-flash backup.
    The USB console stays silent under this firmware, but that is not a
    regression -- projects/i2c-variant-scan printed over the same USB-Serial/JTAG
    console earlier the same night, so the path works and this sketch simply
    does not use it. Silence was not treated as evidence either way.'
- date: '2026-09-05'
  tested: restore
  method: 'Read the full 16MB back after the restore and compared it against the backup region by region
    -- bootloader, partition table, and each of the six partitions -- rather than relying on a whole-image
    hash. The comparison was validated first against two controls: the backup against itself (all regions
    zero) and against an unrelated 16MB image (differences everywhere, with the per-region totals reconciling
    exactly against the whole-image count, which is what proves the regions leave no gap a difference
    could hide in).'
  result: verified
  note: 'BIT-IDENTICAL. Zero differing bytes across all 16,777,216, every region, and the read-back sha256
    equals the backup''s exactly (248da9dd5525c5e276e46a07d9b3d8672ea2f2aeac17263381aba1690badc2b0). First
    16MB restore verification in the repo -- double the previous largest -- and the first verified after
    DIFFERENT firmware ran on the board: this one had projects/i2c-variant-scan flashed onto it, ran it,
    and was then restored. A caveat was recorded BEFORE the measurement: the verification came hours and
    several power cycles after the restore, so a non-zero nvs delta could not have been attributed to
    the restore rather than to the firmware''s own boots. The zero result makes that caveat moot -- nothing
    wrote to flash at all, so there is nothing for the extra boots to have confounded. Kept rather than
    deleted, because it was the right caveat for the result it was written against. Places this board
    with the ESP8266 (0 bytes) rather than the QT Pys (50, 50, 49 in nvs): its arduino firmware writes
    nothing to flash on boot.'
- date: '2026-09-04'
  tested: board.model_variant
  method: 'Flashed projects/i2c-variant-scan and read the console. Reproduces LilyGo_AMOLED::begin()''s
    autodetect: probe SDA=1/SCL=2 for AXP2101, then SDA=3/SCL=2 for CST816 and PCF85063, then SDA=6/SCL=7
    for SY6970, stopping at the first hit. Backup taken and verified first; board restored after.'
  result: verified
  note: 'SDA=1/SCL=2 silent. SDA=3/SCL=2 answered 0x15, 0x51, 0x6b -- touch, RTC and BQ25896 PMU together,
    which is the Plus and nothing else in the family. SDA=6/SCL=7 never driven. Consequence worth recording:
    all three conflicting GPIOs resolve to the side the older non-touch repo would have got wrong -- GPIO38
    is OL_EN (panel power enable) not PIN_LED, GPIO21 is touch INT not a button, and GPIO4''s ADC path
    is dead code shadowed by the BQ25896. The circumstantial evidence recorded earlier pointed at the
    non-touch board and was wrong on all three.'
- date: '2026-09-05'
  tested: board.read_baud_max
  method: Full 16MB esptool read-flash via the backup baud ladder.
  result: verified
  note: Seventh board, fourth USB-Serial/JTAG. Confirms 230400 for the interface group a fourth time.
    Also the first 16MB read in the repo, so the size-derived timeout was exercised at double the previous
    maximum without coming close to the ceiling.
