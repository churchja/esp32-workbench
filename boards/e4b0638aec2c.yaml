verification_log:
- date: '2026-09-05'
  tested: firmware_running
  method: 'Flashed LilyGO''s published factory image at 0x0 through the backup
    gate, then re-probed and compared app_elf_sha256. Boot confirmed separately
    by reading the 20KB nvs partition and diffing it against the pre-flash
    backup rather than by watching a console.'
  result: verified
  note: 'THE VERSION STRINGS CANNOT VERIFY THIS FLASH. The published image and
    the image it replaced carry byte-identical descriptors -- project
    arduino-lib-builder, version "esp-idf: v4.4.7 38eeba213a", built Mar 5 2024
    12:12:53. All of it unchanged before and after. The only field that moved is
    app_elf_sha256: 61d714e4... -> b697e0d2..., matching the downloaded image
    exactly. esp_app_desc_t carries exactly one field that identifies a build,
    and it is not any of the human-readable ones.
    WHAT THE FLASH GAINED, established by comparing symbol strings in the two
    binaries rather than inferred from a file date: the published image carries
    2 references to PCF85063 and the resident app carried NONE. This board has a
    PCF85063 RTC at 0x51 -- one of the three devices whose presence identified it
    as the Plus -- and the firmware it shipped with could not talk to it. CST816
    went 4 -> 6 references. The display path is unchanged and the panel looks
    identical, which is the expected result: initSequence.cpp/.h has had zero
    commits since 2024-12-18.
    CORRECTS A RESEARCH CLAIM. The source sweep concluded BOARD_AMOLED_191_SPI
    first appears in library v1.1.0 (2024-10-14), so firmware stamped March 2024
    "predates its own board support". The resident binary contains
    beginAMOLED_191_SPI, so it did not. The stamp is the arduino-lib-builder
    CORE build time, not the sketch''s, so it cannot date the firmware at all --
    the resident app was built some unknown time after October 2024 while
    reporting Mar 5 2024 12:12:53.
    Pre-flash diff established the risk was low: bootloader IDENTICAL (0 of
    32768 bytes differ) and partition table IDENTICAL (0 of 4096), so only app0
    changed. The apps themselves differ in 1,769,209 of 2,501,392 bytes (70.7%),
    and the resident app was 8,784 bytes longer -- walking the six ESP image
    segments showed everything past its end was cleanly 0xff, so the earlier
    "contains data" reading was a naive scan against the wrong boundary.
    BOOT EVIDENCE: 688 of 20,480 nvs bytes changed against the pre-flash backup.
    The USB console stays silent under this firmware, but that is not a
