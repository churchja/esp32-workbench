board:
  read_baud_max:
    value: 230400
    provenance: verified
    note: 'Physical test via the backup ladder: 460800 failed with serial corruption, 230400 read the
      full 16MB. Fourth independent USB-Serial/JTAG board and the fourth to land on exactly this ceiling
      (e072a1fb9c5c, 3cdc75edd7b0, aca704007f60), across four different vendors, MACs and memory configs
      -- the per-interface model now has four confirmations and no counterexample. First 16MB read the
      ladder has attempted, so it also doubles the largest image size the derived timeout has been exercised
      against: the derived ceiling was 2244s (size/(baud/10)*3+60) against a 756.5s actual, ~3x margin
      as designed.'
    confirmed_by_second_read: The board was read again after the timer fix and the two runs settle this
      directly. Run 1 recorded read_seconds 756.5 with no attempts list; run 2 recorded read_seconds 747.3
      and ladder_seconds 756.8, with a 9.5s discarded 460800 attempt. The old field and the new ladder_seconds
      agree within 0.3s on the same board doing the same operation -- so the old read_seconds was indeed
      whole-ladder time, and the estimate of "somewhat under 756.5s" below is now measured at 747.3s (2.6%
      over the 728.1s model, not the 3.9% the inflated figure implied).
    caveat: 'The recorded read_seconds (756.5) is whole-ladder wall time -- it includes the failed 460800
      attempt, which this backup had no way to separate out. The 230400 read alone is therefore somewhat
      under 756.5s. Against the 10-bits-per-byte model (16777216*10/230400 = 728.1s predicted) the ladder-inclusive
      figure is 3.9% over, so the read alone is closer to the model than any prior USB-Serial/JTAG measurement
      -- but this is a bound, not a measurement. This board was the last to be recorded that way: read_with_fallback
      now times each rung separately and manifests carry read_seconds (successful rung), ladder_seconds
      (wall total) and a per-rung attempts list. This entry predates that and was deliberately not retro-fitted
      -- the split cannot be recovered after the fact.'
  vendor:
    value: LilyGO
    provenance: vendor_doc
    source: https://raw.githubusercontent.com/Xinyuan-LilyGO/LilyGo-AMOLED-Series/master/README.MD
  model_variant:
    value: T-Display-S3 AMOLED Plus 1.91in (RM67162, single SPI)
    provenance: verified
    note: 'Resolved 2026-09-04 by I2C scan on hardware, not by reading. Three devices answered on SDA=3/SCL=2:
      0x15 CST816 touch (so a 1.91in TOUCH board), 0x51 PCF85063 RTC (so the PLUS, not the Touch), and
      0x6b BQ25896 PMU (the BOARD_AMOLED_191_SPI signature). SDA=1/SCL=2 was silent, ruling out the 1.47in
      Lite''s AXP2101. The SDA=6/SCL=7 pair was never driven -- the scan exits at the first hit, as LilyGO''s
      own autodetect does. NOT determinable over USB: every board in this family is ESP32-S3R8 with 16MB
      flash and 8MB OPI PSRAM, which is why this needed a flash and a scan.'
    scanner: projects/i2c-variant-scan
  variant_bus:
    value: single SPI, 40MHz (NOT QSPI)
    provenance: vendor_doc
    source: https://raw.githubusercontent.com/Xinyuan-LilyGO/LilyGo-AMOLED-Series/master/src/LilyGo_AMOLED.h
    note: RM67162_AMOLED_SPI sets d2 = d3 = -1. The QSPI pin set that two vendor repos agreed on -- SCK
      47, D0 18, D1 7, D2 48, D3 5, CS 6, RST 17 at 75MHz -- is real and belongs to a DIFFERENT board.
      It does not apply here.
