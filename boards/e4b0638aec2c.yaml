pinmap:
  _source_note:
    value: three independent sources agree; none tested on THIS board
    provenance: unverified
    note: 'Pins below agree across LilyGO''s LilyGo-AMOLED-Series header, the
      older T-Display-S3-AMOLED factory example, and crosser/esp-lcd-panel-rm67162
      v0.3.0 (main/Kconfig.projbuild defaults). Three sources reaching the same
      numbers independently is strong, and is still not a measurement on this
      unit. VARIANT CAVEAT: all three describe the NON-TOUCH QSPI board. This
      board is the 1.91in Plus (RM67162 over regular SPI, CST816 touch at 0x15,
      PCF85063 RTC at 0x51, BQ25896 PMU at 0x6b). D2 and D3 are unused on a
      regular-SPI wiring, and GPIO21/GPIO4 carry DIFFERENT functions here than on
      the non-touch board -- see the pinmap research_queue entry.'
  lcd_sck:
    value: 47
    provenance: verified
  lcd_d0_mosi:
    value: 18
    provenance: verified
  lcd_d2:
    value: 48
    provenance: unverified
    note: QSPI only. Unused on this board's regular-SPI wiring (d2 = -1).
  lcd_d3:
    value: 5
    provenance: unverified
    note: QSPI only. Unused on this board's regular-SPI wiring (d3 = -1).
  lcd_cs:
    value: 6
    provenance: verified
  lcd_rst:
    value: 17
    provenance: verified
    note: Active HIGH per the driver example's RST_ACTIVE_LEVEL default.
  touch_sda:
    value: 3
    provenance: verified
    note: 'CST816S touch, PCF85063 RTC and BQ25896 PMU all sit on this bus. Probed
      on this unit 2026-09-06 with the IDF 6.0 i2c_master driver at 100kHz: 0x15,
      0x51 and 0x6B all ACK, and 0x15 answers register reads.'
  touch_scl:
    value: 2
    provenance: verified
    note: 'Same bus as touch_sda. See the 2026-09-06 verification_log entry.'
  touch_int:
    value: 21
    provenance: verified
    note: 'CST816S interrupt, NOT a button -- the older non-touch repo calls GPIO21
      a button and is wrong for this variant. Measured as a short PULSE, not a level
      held for the duration of a touch: low on 4 of 200 samples while 34 touch events
      were read. Usable as a falling-edge wake source; coordinates still need a poll.'
  sd_miso:
    value: 13
    provenance: vendor_doc
    source: https://raw.githubusercontent.com/Xinyuan-LilyGO/LilyGo-AMOLED-Series/master/src/LilyGo_AMOLED.h
    note: 'AMOLED_191_SPI_SD_PINS = {13 MISO, 12 MOSI, 14 SCK, 11 CS} in LilyGO''s
      own board table, corroborated by the V1.0 schematic (J1 microSD, and the
      CN4/CN5 2.5mm breakout pairs which carry SD_CS+SD_MOSI and SD_MISO+SD_SCK).
      NOT PROBED -- no card has been inserted and no transfer attempted, so this
      is vendor_doc rather than verified.'
  sd_mosi:
    value: 12
    provenance: vendor_doc
    source: https://raw.githubusercontent.com/Xinyuan-LilyGO/LilyGo-AMOLED-Series/master/src/LilyGo_AMOLED.h
  sd_sck:
    value: 14
    provenance: vendor_doc
    source: https://raw.githubusercontent.com/Xinyuan-LilyGO/LilyGo-AMOLED-Series/master/src/LilyGo_AMOLED.h
  sd_cs:
    value: 11
    provenance: vendor_doc
    source: https://raw.githubusercontent.com/Xinyuan-LilyGO/LilyGo-AMOLED-Series/master/src/LilyGo_AMOLED.h
    note: 'CAUTION: GPIO11-14 are the SD SPI bus AND are broken out on the P4/P5
      headers. Anything driving those pins for another purpose will fight the
      card slot.'
  lcd_dc:
    value: 7
    provenance: verified
    bus_position: 'Occupies the D1 lane in the QSPI wiring; on this board it is
      the DC line and must NOT also be claimed as SPI data1.'
    source: https://raw.githubusercontent.com/Xinyuan-LilyGO/LilyGo-AMOLED-Series/master/src/LilyGo_AMOLED.h
    note: 'GPIO7 IS THE DC PIN, proven on hardware -- the display only lit once
      the transport toggled it. This entry previously read "THERE IS NO DC PIN",
      which was a correction of a correct original reading and was itself the
      error that cost roughly four hours.
      What misled: RM67162_AMOLED_SPI sets its separate DC struct field to
      BOARD_NONE_PIN, so the field was read as authoritative. It is not used on
      this path. LilyGo_AMOLED.cpp::writeCommand() drives display.d1 -- GPIO7 --
      directly: digitalWrite(d1, LOW) around the command byte, HIGH around the
      data bytes. The //DC comment beside 7 in the struct was literal.
      Lesson recorded because it generalises: the struct said one thing and the
      code that CONSUMES the struct said another. Reading the consumer settled
      in one glance what six configuration permutations could not.'
  lcd_pwr:
    value: 38
    provenance: verified
    note: 'PANEL POWER ENABLE, on-level 1 (active high). The single most
      corroborated pin here: LilyGO''s Touch and Plus schematics label GPIO38
      OL_EN, and the driver example independently defaults HWE_DISPLAY_PWR to 38
      with HWE_DISPLAY_PWR_ON_LEVEL 1, its readme noting the Waveshare board it
      also supports has no such pin. DANGER: the older non-touch repo calls this
      pin PIN_LED. Driving it as an indicator gates the display rail.'
  lcd_te:
    value: 9
    provenance: verified
    note: 'Tearing-effect line. Present ONLY in LilyGo_AMOLED.h''s
      RM67162_AMOLED_SPI block -- absent from the older factory example and from
      the crosser driver example, so this pin was invisible until the Plus''s own
      config was read.'
  button_1:
    value: 0
    provenance: verified
    note: >-
      GPIO0, active low, measured -- which is what the three sources said all
      along. The detour is worth recording. GPIO21 was briefly recorded as
      verified on a single unreproduced reading, then retracted. Several rounds
      of scanning afterwards found nothing at all, and that silence was NOT
      data: the full-screen animation was wedging the render loop, so every
      press test ran against a frozen app. Once the animation stopped using
      transform_scale, GPIO0 reproduced immediately -- 8 consecutive sample
      windows, sole pin low, verification firing on each press.
      The board's other button is RESET, wired to the chip reset line, so no
      GPIO can observe it. LilyGo's docs list an IO21 button on this family; it
      is not wired as a switch to ground on this unit. GPIO4 reads low at boot
      and is battery voltage sensing per the vendor pinout, not a button.
display:
  width:
    value: 240
    provenance: unverified
    note: Non-rotated. Used as 536x240 landscape; see the display research_queue
      entry for the orientation-convention trap.
  height:
    value: 536
    provenance: unverified
  init_sequence_is_variant_specific:
    value: the Plus needs rm67162_spi_cmd, not rm67162_cmd
    provenance: vendor_doc
    source: https://raw.githubusercontent.com/Xinyuan-LilyGO/LilyGo-AMOLED-Series/master/src/LilyGo_AMOLED.h
    note: 'THE REASON A WORKING ESP-IDF DRIVER STILL LEAVES THIS PANEL BLACK.
      LilyGo_AMOLED.h carries TWO init command arrays for the same controller:
      RM67162_AMOLED (QSPI) uses rm67162_cmd / RM67162_INIT_SEQUENCE_LENGTH at
      line 170, and RM67162_AMOLED_SPI (this board) uses rm67162_spi_cmd /
      RM67162_INIT_SPI_SEQUENCE_LENGTH at line 193. Bus width and init sequence
      are INDEPENDENT. Selecting "Regular SPI" in a driver that ships only the
      QSPI sequence changes how bytes are clocked out and not which commands are
      sent, so the panel is initialised with commands its wiring does not accept
      and stays dark while every ESP32-side call returns success.
      Tested on hardware 2026-09-05: crosser/esp-lcd-panel-rm67162 v0.3.0 ran
      cleanly to "Turn on the screen" with no error, three times, and the panel
      never lit. No Kconfig setting fixes this -- the driver would need
      rm67162_spi_cmd added.'
  amoled_black_is_ambiguous:
    value: an unlit AMOLED and one drawing black are indistinguishable
    provenance: inferred
    note: 'Worth stating because it shaped the whole debug. There is no
      backlight, so "panel unpowered" and "panel powered, initialised, receiving
      all-zero pixels" produce the same observation. A blank screen therefore
      does not narrow the fault the way it would on an LCD. The discriminating
      test is a SOLID BRIGHT FILL, which removes the graphics stack from the
      question entirely -- not an LVGL demo.
      INFERRED, not verified: this is reasoned from the display technology and
      is consistent with three observations of a black panel, but no test ever
      demonstrated this panel CAN light. Until a solid fill does that, "black"
      remains uninformative and the possibility that the panel is simply dead
      has not been excluded. The validator rejected a "verified" claim here,
      correctly.'
  color_format:
    value: RGB565, no byte swap, not inverted
    provenance: verified
    note: 'Solid fills of 0xFFFF, 0xF800, 0x07E0 and 0x001F rendered as white,
      red, green and blue in that order. Byte-swapped RGB565 would have shown
      red as a dark blue-green and green as a dark purple; an inverted panel
      would have shown each as its complement. Neither happened, so the pixel
      format set by the init sequence (0x3A -> 0x75) matches what esp_lcd sends
      and needs no swap or invert flag.'
  addressing_covers_panel:
    value: full 240x536 addressed with no gaps
    provenance: verified
    note: 'The fill wrote in 16-row stripes from 0 to CONFIG_HWE_DISPLAY_HEIGHT
      across the full width, and each colour covered the panel completely. That
      rules out a column/row offset and a wrong width or height -- either would
      have left an unpainted band or wrapped the image.'
  orientation:
    value: swap_xy(true) + mirror(true, false) -> upright landscape
    provenance: verified
    note: 'Settled by asymmetric content: the LVGL scroll text that follows the
      solid fills reads upright and left-to-right. The fills could not establish
      this -- a uniform colour is rotation-invariant, so it looks identical under
      any swap_xy/mirror combination. Recorded as a separate fact from
      color_format and addressing for exactly that reason: one experiment proved
      those two and was structurally incapable of proving this one.
      Native panel geometry is 240x536 portrait; these two calls present it as
      536x240 landscape, which is how the demo and LilyGO''s own examples use it.'
  controller:
    value: RM67162
    provenance: community
    source: https://components.espressif.com/components/crosser/esp-lcd-panel-rm67162
peripherals:
  touch_controller:
    value: CST816S
    provenance: verified
    note: 'Chip id register 0xA7 read 0xB5 = CST816S on this unit 2026-09-06,
      with vendor 0x22 and firmware 0x03. NOTE THE DISAGREEMENT: LilyGO''s own
      LilyGo_AMOLED.h line 233 comments the entry "Touch CST816T", which would be
      0xB6. The silicon says otherwise, and a register read outranks a source
      comment. Either the comment is loose or the part was second-sourced.
      No reset line exists -- the vendor table records {3 SDA, 2 SCL, 21 IRQ,
      -1 RST} and the touch FPC P3 is a six-pin connector.'
  rtc:
    value: PCF85063ATL
    provenance: probed
    note: 'ACKs at 0x51 on SDA=3/SCL=2. Address decode only -- no register has
      been read and no time has been set or kept, so this is probed, not
      verified. The schematic shows U7 PCF85063ATL with U8 MS412FE-FL26E as its
      backup cell. Worth knowing: the factory firmware resident on this board
      contained ZERO references to the part, so the RTC shipped unused.'
  charger_pmu:
    value: BQ25896
    provenance: probed
    note: 'ACKs at 0x6B. Address decode only. Schematic U6. Its presence
      alongside 0x15 and 0x51 is the signature that identified this unit as the
      Plus rather than any other board in the family.'
  amoled_pmic:
    value: AXPM65611
    provenance: vendor_doc
    source: https://raw.githubusercontent.com/Xinyuan-LilyGO/LilyGo-AMOLED-Series/master/schematic/T-Display-S3-AMOLED-Plus.pdf
    note: 'Schematic U4. Generates the AMOLED panel rails, ELVDD +4.6V and ELVSS
      -2.2V. NOT ON THE I2C BUS -- it is SWIRE/EN controlled, which is exactly
      why a bus scan finds only three devices on a board carrying two power ICs.
      Its enable is GPIO38, the same pin the display driver calls OL_EN and this
      repo records as lcd_pwr: so "display power" on this board is really "AMOLED
      rail PMIC enable".'
  storage:
    value: microSD slot, SPI
    provenance: vendor_doc
    source: https://raw.githubusercontent.com/Xinyuan-LilyGO/LilyGo-AMOLED-Series/master/schematic/T-Display-S3-AMOLED-Plus.pdf
    note: 'Schematic J1. Pins in pinmap as sd_miso/sd_mosi/sd_sck/sd_cs. Never
      exercised.'
  audio:
    value: none
    provenance: vendor_doc
    source: https://raw.githubusercontent.com/Xinyuan-LilyGO/LilyGo-AMOLED-Series/master/schematic/T-Display-S3-AMOLED-Plus.pdf
    note: 'RECORDED AS AN ABSENCE ON PURPOSE, so the question does not get asked
      twice. No speaker, no buzzer, no microphone, no I2S codec or amplifier. The
      V1.0 schematic''s complete active-device inventory is U1 40MHz crystal, U2
      ESP32-S3R8, U3 W25Q128JV, U4 AXPM65611, U5 RT9080-33GJ5, U6 BQ25896, U7
      PCF85063ATL, U8 backup cell -- there is no ninth device. LilyGO''s
      BoardsConfigure_t struct has no audio field for ANY variant in the family.
      Sound on this board has to be external.'
research_queue:
- field: model_variant
  status: resolved
  why: 'Resolved on hardware 2026-09-04 by I2C scan -- T-Display-S3 AMOLED Plus 1.91in. See board.model_variant
    and the verification_log entry. Kept rather than deleted because the METHOD is the reusable part:
    no LilyGO AMOLED board can be told from its siblings over USB, so any future one needs the same
    scan.'
  how: python3 tools/esp32flash.py backup && flash projects/i2c-variant-scan && restore.
- field: display
  status: resolved
  why: The variant is known now, so the candidate set collapses to one row -- but the controller and
    bus below come from vendor files, not from this board.
  how: 'For the Plus: RM67162 over SINGLE SPI at 40MHz -- NOT the 75MHz QSPI wiring. LilyGo_AMOLED.h
    RM67162_AMOLED_SPI sets d2 = d3 = -1, so the widely-quoted 4-data-line pin set belongs to a different
    board. Geometry is 240x536 native portrait, used as 536x240 landscape. cmdBits 8 / addrBits 24
    hold across the family; the clock does not. No BSP exists (board.bsp_component), so a driver must
    be written or adopted.'
  danger: The 536x240 figure is a board+panel property, not an RM67162 property -- the Raydium datasheet
    does not list that geometry, so "has an RM67162" does not entail it.
- field: pinmap
  status: unknown
  why: The variant is settled, so the three cross-variant conflicts are settled with it. What remains
    is that no pin has been confirmed ON THIS BOARD -- vendor files are one source and this unit already
    caught a vendor schematic being wrong about its own flash part (see schematic_trust).
  how: Take the Plus rows from LilyGo_AMOLED.h and its schematic, and mark every pin 'unverified'
    until a physical test confirms it.
  resolved_conflicts: All three now have an answer, and all three are the side the older non-touch
    repo would have got WRONG. GPIO38 = OL_EN, the AMOLED panel POWER ENABLE -- not PIN_LED. GPIO21
    = touch controller INT -- not a button. GPIO4 = nominally the battery ADC but SHADOWED by the
    BQ25896 PMU, so the ADC path is dead code.
  danger: Driving GPIO38 as an indicator LED gates the display rail. Driving GPIO21 as an output fights
    a touch controller interrupt line. Both were live risks while the variant was unknown, which is
    why no pinmap was written; they are still live for anyone copying the non-touch pin set onto this
    board.
- field: power
  status: resolved
  why: Settled by the variant. This board reads battery voltage over I2C from a BQ25896 PMU at 0x6b
    -- confirmed present by the scan -- NOT through a resistive divider.
  how: Use the PMU. LilyGo_AMOLED::getBattVoltage() returns BQ.getBattVoltage() on this variant and
    never reaches the ADC branch.
  danger: The divider ratio 2.0 on GPIO4, established from the vendor schematic and the driver source,
    belongs to the 1.91in QSPI board and NOT to this one. Applying analogReadMilliVolts(4) * 2 here
    exercises dead code and returns a plausible-looking wrong number rather than failing. This is
    the concrete case for why it was never recorded as a value.
- field: schematic_trust
  status: caution
  why: The non-touch T-DISPLAY-S3-AMOLED schematic shows U3 = W25Q32 (4MB). This unit probed 0xef/0x4018
    = W25Q128 = 16MB, and the Touch and Plus schematics show W25Q128. So at least one published LilyGO
    schematic disagrees with shipped hardware.
  how: Treat any single schematic as one source, not as ground truth. Cross-check against the board
    JSON, the library headers and -- where the chip can answer, as it did for flash and for the variant
    itself -- against the silicon.
