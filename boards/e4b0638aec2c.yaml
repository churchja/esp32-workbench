board:
  read_baud_max:
    value: 230400
    provenance: verified
    note: 'Physical test via the backup ladder: 460800 failed with serial corruption,
      230400 read the full 16MB. Fourth independent USB-Serial/JTAG board and the
      fourth to land on exactly this ceiling (e072a1fb9c5c, 3cdc75edd7b0,
      aca704007f60), across four different vendors, MACs and memory configs --
      the per-interface model now has four confirmations and no counterexample.
      First 16MB read the ladder has attempted, so it also doubles the largest
      image size the derived timeout has been exercised against: the derived
      ceiling was 2244s (size/(baud/10)*3+60) against a 756.5s actual, ~3x margin
      as designed.'
    caveat: 'The recorded read_seconds (756.5) is whole-ladder wall time -- it
      includes the failed 460800 attempt, which this backup had no way to
      separate out. The 230400 read alone is therefore somewhat under 756.5s.
      Against the 10-bits-per-byte model (16777216*10/230400 = 728.1s predicted)
      the ladder-inclusive figure is 3.9% over, so the read alone is closer to
      the model than any prior USB-Serial/JTAG measurement -- but this is a
      bound, not a measurement. This board was the last to be recorded that way:
      read_with_fallback now times each rung separately and manifests carry
      read_seconds (successful rung), ladder_seconds (wall total) and a per-rung
      attempts list. This entry predates that and was deliberately not
      retro-fitted -- the split cannot be recovered after the fact.'
  vendor:
    value: LilyGO
    provenance: vendor_doc
    source: https://raw.githubusercontent.com/Xinyuan-LilyGO/LilyGo-AMOLED-Series/master/README.MD
  model_variant:
    value: null
    provenance: unverified
    note: 'NOT DETERMINED -- and not determinable by probing. Recorded as an
      explicit negative so the next session does not re-run the search. "LilyGO
      T-Display S3 AMOLED" names a FAMILY of at least six boards that differ in
      panel controller, resolution, bus and pin assignment. Every one of them is
      ESP32-S3R8 with 16MB flash and 8MB OPI PSRAM, so the eFuse reading that
      separated the other six boards in this repo separates nothing here.'
  variant_candidates:
    value:
    - T-Display-AMOLED-Lite 1.47in 194x368 SH8501
    - T-Display-S3 AMOLED 1.91in 240x536 RM67162 (QSPI)
    - T-Display-S3 AMOLED Plus 1.91in 240x536 RM67162 (single SPI)
    - T4-S3 2.41in 450x600 RM690B0
    - T-Display-S3-AMOLED-1.64 280x456
    - T-Display-S3-AMOLED-1.43/1.75 466x466 round, CO5300 or SH8601
    provenance: vendor_doc
    source: https://raw.githubusercontent.com/Xinyuan-LilyGO/LilyGo-AMOLED-Series/master/README.MD
    note: 'The first four come from the vendor support table, which lists all
      four as ESP32-S3R8/16MB/8MB(OPI). The last two live in separate repos;
      the 1.43/1.75 ships board files for 4MB, 8MB and 16MB flash, so flash size
      does not exclude it either.'
  probe_discriminates_variant:
    value: false
    provenance: probed
    note: 'Every identifying field this repo collects turned out to be generic.
      partition_table_md5 b32dcdb83b1674af27768c92b1f88a62 is byte-for-byte
      espressif/arduino-esp32 tools/partitions/default_16MB.csv -- a stock
      Arduino layout, not a LilyGO board file. USB 303a:1001 is the generic
      Espressif native USB-Serial/JTAG ID. The "arduino-lib-builder / v4.4.7"
      app description is the standard arduino-esp32 core build stamp. Useful to
      know: these three fields identify a BUILD, never a board.'
  variant_evidence_weak:
    value: consistent with the 1.91in non-touch board, not proof
    provenance: community
    source: https://raw.githubusercontent.com/Xinyuan-LilyGO/T-Display-S3-AMOLED/main/boards/lilygo-t-amoled.json
    note: 'That board file declares flash_size 16MB, flash_mode qio, memory_type
      qio_opi, hwids [0x303A,0x1001] and partitions default_16MB.csv -- all four
      match the probe. The factory app (ESP-IDF v4.4.7, Mar 5 2024) also falls in
      the Arduino-core era that repo requires (2.0.5 <= version < 3.0.0).
      CIRCUMSTANTIAL: the same board file would match several siblings.'
  bsp_component:
    value: none exists
    provenance: vendor_doc
    source: https://components.espressif.com/
    note: 'Searched the ESP Component Registry and espressif/esp-bsp: no board
      support package exists for ANY variant in this family. The "check for a
      BSP first" shortcut that the research_queue recommends is closed for this
      board -- a panel driver must be written or a third-party one adopted.'
