; ---------------------------------------------------------------------------
; Board-agnostic ESP32 starting point.
;
; Fill `board` from the identification profile, not from a guess:
;   python3 tools/esp32ident.py --save
;   pio boards | grep -i <vendor>          # find a registry match
;
; If no exact match exists, target the generic module for the chip family and
; supply board-specific pins through build_flags. That is the normal case for
; clones and small vendors, and it works fine.
; ---------------------------------------------------------------------------

[env]
; Pinned, because recommendations.md tells you to pin and unpinned platforms
; silently break working boards when the toolchain moves. Bump deliberately:
;   pio platform update espressif32
; Verified installed on this machine: 6.13.0
platform  = espressif32@6.13.0
framework  = arduino
monitor_speed = 115200

; Binds the repo's one rule -- no write without a verified backup -- to the
; actual upload path. Covers `pio run -t upload`, `-t uploadfs`, and anything
; driving PlatformIO underneath (including the platformio MCP server).
; Bypass deliberately with:  ESP32_NO_GATE=1 pio run -t upload
extra_scripts = pre:scripts/backup_gate.py
monitor_filters = esp32_exception_decoder, time
build_flags =
    -DCORE_DEBUG_LEVEL=3

; --- pick ONE env below, or add your own -----------------------------------

[env:esp32dev]                    ; classic ESP32-D0WD, CH340/CP210x bridge
board = esp32dev

[env:esp32-s3-devkitc-1]          ; generic S3, native USB
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1          ; S3 native USB: route Serial over USB CDC
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:seeed_xiao_esp32c3]
board = seeed_xiao_esp32c3

; ---------------------------------------------------------------------------
; C5 / C6 / H2 / P4 REQUIRE A DIFFERENT PLATFORM.
;
; Verified 2026-09-04 against the live registry and board definitions:
; the OFFICIAL platformio/espressif32 platform -- both the installed 6.13.0
; and the current 7.1.0 -- pins Arduino core 2.0.17, which predates these
; chips. Its esp32-c6-devkitc-1.json declares frameworks: ["espidf"] only,
; so `framework = arduino` fails instantly with:
;     Error: This board doesn't support arduino framework!
; Upgrading the official platform does NOT fix this.
;
; The community pioarduino fork tracks arduino-esp32 master + ESP-IDF 5.5.5
; and ships 299 boards, including 5x C5, 10x C6, 1x H2, 6x P4 -- all
; declaring frameworks: ["arduino", "espidf"].
;
; First build downloads a fresh toolchain (~1GB). One time, then cached.
; ---------------------------------------------------------------------------

[pioarduino]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip

[env:esp32-c6-devkitc-1]
platform = ${pioarduino.platform}
board = esp32-c6-devkitc-1
framework = arduino
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:adafruit_feather_esp32c6]
platform = ${pioarduino.platform}
board = adafruit_feather_esp32c6
framework = arduino

[env:esp32-c5-devkitc-1]
platform = ${pioarduino.platform}
board = esp32-c5-devkitc-1
framework = arduino

; --- flash/PSRAM: set these from the PROBED profile, not the board default --
; board_upload.flash_size   = 8MB
; board_build.flash_size    = 8MB
; board_build.partitions    = huge_app.csv
; board_build.arduino.memory_type = qio_opi     ; only if PSRAM was probed
